async function badCodeWhy(url,j){ // 403 to {action:"results"}: which of the three causes
  if(j.detail==="TEACHER_CODE not set") return t("tcMissing");
  // A Worker without the results action treats the request as a student attempt: with a class code it then
  // answers 400 "shape" (nothing is saved), where a current Worker answers 403 again.
  try{

}

    </div>
    <div class="grid g2" style="margin:0 0 14px">${sumTable(t("avgLecture"),lectures)}${sumTable(t("avgGroup"),groups)}</div>
    <div class="tbl-scroll"><table class="data">
      <thead><tr><th></th><th>${esc(t("thDate"))}</th><th>${esc(t("thName"))}</th><th>${esc(t("code"))}</th><th>${esc(t("klass"))}</th><th>${esc(t("thAtt"))}</th><th class="num">${esc(t("thScore"))}</th><th class="num">${esc(t("thPts"))}</th><th class="num">${esc(t("thT"))}</th></tr></thead>
      <tbody>${clsGroups(rows).map(([kc,label,rs])=>`<tr class="trk"><td colspan="9">${esc(label)}</td></tr>`+rs.map(r=>clsRow(r)).join("")).join("")}</tbody>
    </table></div>
    <details class="roster" style="margin:12px 0 0" id="e-trashwrap"${TRASH_OPEN?" open":""}><summary>${esc(t("trashH"))} (<span id="e-trashn">${TRASH?TRASH.length:0}</span>)</summary>
      <p class="hint" style="margin:4px 0 8px">${esc(t("trashP"))}</p>
      <div id="e-trashout"></div>
    </details>`;
  $("#e-clsf").onchange=e=>{ CLS.filter=e.target.value; drawClass(); };
  $("#e-unif").onchange=e=>{ CLS.ufilter=e.target.value; drawClass(); };
  const tw=$("#e-trashwrap");
  if(tw) tw.ontoggle=e=>{ TRASH_OPEN=e.target.open; if(TRASH_OPEN){ if(TRASH) drawTrash(); else loadTrash(); } };
  if(TRASH_OPEN){ if(TRASH) drawTrash(); else loadTrash(); }
  const updDel=()=>{ const n=document.querySelectorAll(".rdel:checked").length; const s2=$("#e-deln"); if(s2) s2.textContent=n; };
  document.querySelectorAll(".rdel").forEach(c=>c.onchange=updDel); updDel();
  $("#e-del").onclick=async ()=>{
    const ids=[...document.querySelectorAll(".rdel:checked")].map(c=>c.dataset.id);
    if(!ids.length) return;
    if(!confirm(t("delConf").replace("{n}",ids.length))) return;
    const btn=$("#e-del"), msg=$("#e-delmsg"); btn.disabled=true; msg.textContent="";
    const url=submitURL(), fails=[];
    for(const id of ids){
      try{
        const r=await toWorker(url,{action:"trashresult",code:TRCODE,id});
        const j=await r.json().catch(()=>({}));
        if(r.ok&&j.ok) continue;
        if(r.status===404) continue; // already gone: counts as moved
        fails.push(id+(r.status===403?" \u2715":" ?"));
      }catch(e){ fails.push(id+" ?"); }
    }
    btn.disabled=false;
    const denied=fails.filter(f=>f.endsWith(" \u2715")).map(f=>f.slice(0,-2)), other=fails.filter(f=>!f.endsWith(" \u2715"));
    let doneMsg=t("delDone");
    if(denied.length) doneMsg=t("delDeny");
    if(other.length) doneMsg+=(denied.length?" ":"")+t("delFail")+" "+other.join(", ");
    await fetchClass(); drawClass();
    if(TRASH_OPEN) loadTrash();
    const m2=$("#e-delmsg"); if(m2) m2.textContent=doneMsg;
  };
}

/* ---------- trash (attempts moved out of the results table) ---------- */
async function loadTrash(){
  const out=$("#e-trashout"); if(!out) return;
  out.innerHTML=`<p class="hint">${esc(t("clsBusy"))}</p>`;
  const url=submitURL();
  if(!url){ out.innerHTML=`<p class="hint">${esc(t("trNeedURL"))}</p>`; return; }
  if(!TRCODE){ out.innerHTML=`<p class="hint">${esc(t("trNeedCode"))}</p>`; return; }
  try{
    const r=await toWorker(url,{action:"listtrash",code:TRCODE});
    const j=await r.json().catch(()=>({}));
    if(r.status===403){ out.innerHTML=`<p class="hint">${esc(t("delDeny"))}</p>`; return; }
    if(!r.ok||!j.ok){ out.innerHTML=`<p class="hint">${esc(t("clsFail"))} (${r.status}${j.error?" "+j.error:""})</p>`; return; }
    TRASH=j.records||[];
    drawTrash();
  }catch(e){ out.innerHTML=`<p class="hint">${esc(t("wkDown"))}</p>`; }
}
function drawTrash(){
  const out=$("#e-trashout"); if(!out) return;
  const n=$("#e-trashn"); if(n) n.textContent=(TRASH||[]).length;
  const recs=TRASH||[];
  if(!recs.length){ out.innerHTML=`<p class="hint">${esc(t("trashEmpty"))}</p>`; return; }
  out.innerHTML=`<div class="tbl-scroll" style="max-height:240px"><table class="data"><thead><tr><th></th><th>${esc(t("thDate"))}</th><th>${esc(t("thName"))}</th><th>${esc(t("thClass"))}</th><th>${esc(t("thAtt"))}</th><th>${esc(t("thScore"))}</th><th></th><th></th></tr></thead>
<tbody>${recs.map(r=>`<tr><td>${esc(r.id||"")}</td><td>${esc(fmtLocal(r.at))}</td><td>${esc(r.name||"")}</td><td>${esc(r.klass||"")}</td><td>#${r.attempt||1}</td><td>${fmtPts(r.score,r.pct)}${pts(r.n)}</td>
<td><button class="btn" data-act="restore" data-id="${esc(r.id)}">${esc(t("trashRestore"))}</button></td>
<td><button class="btn" data-act="purge" data-id="${esc(r.id)}">${esc(t("trashPurge"))}</button></td></tr>`).join("")}</tbody></table></div>
<p class="hint" id="e-trashmsg" style="margin:6px 0 0"></p>`;
  out.querySelectorAll("button[data-act]").forEach(btn=>{
    btn.onclick=async()=>{
      const id=btn.dataset.id, act=btn.dataset.act, msg=$("#e-trashmsg"); msg.textContent="";
      if(act==="purge"&&!confirm(t("trashPurgeConf"))) return;
      btn.disabled=true;
      const url=submitURL();
      try{
        const r=await toWorker(url,{action:act==="restore"?"restore":"purgetrash",code:TRCODE,id});
        const j=await r.json().catch(()=>({}));
        btn.disabled=false;
        if(!r.ok||!j.ok){ msg.textContent=(r.status===403?t("delDeny"):t("delFail")+" "+(j.error||r.status)); return; }
        TRASH=recs.filter(x=>x.id!==id);
        drawTrash();
        if(act==="restore"){ await fetchClass(); drawClass(); } // re-renders the results table; TRASH is already updated, drawClass re-draws the trash section from it
      }catch(e){ btn.disabled=false; msg.textContent=t("wkDown"); }
    };
  });
}

/* ---------- language ---------- */
function setLang(l){
  LANG=l;
  document.documentElement.lang=l;
  document.querySelectorAll(".langsel button").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.lang===l)));
  document.querySelectorAll("[data-t]").forEach(n=>{ const k=n.getAttribute("data-t"); if(STR[l][k]!==undefined) n.textContent=STR[l][k]; });
  document.querySelectorAll("[data-tt]").forEach(n=>{ const k=n.getAttribute("data-tt"); if(STR[l][k]!==undefined) n.title=STR[l][k]; });
  { const lb=document.getElementById("nav-lab"); if(lb) lb.href="lab.html?lang="+l; }
  P._lang=l; try{ if(typeof UNI!=="undefined" && UNI) localStorage.setItem("qml_lang_"+UNI,l); }catch(e){}
  drawKind(); renderTabs(); renderPage(); if(typeof UNI!=="undefined") drawUniChip();
}
document.querySelectorAll(".langsel button").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
document.querySelectorAll(".kindsel button").forEach(b=>b.onclick=()=>setKind(b.dataset.kind));

const UNIS = {
  lisbon:{short:"FA ULisboa", name:"Lisbon School of Architecture", langs:["pt","en"]},
  warsaw:{short:"SGGW", name:"Warsaw University of Life Sciences", langs:["en"]},
};
const UNI = "lisbon";
function drawUniChip(){}
function setUni(u){
  const langs=UNIS[u].langs;
  $(".langsel").style.display = langs.length>1 ? "" : "none";
  let l=""; try{ l=new URLSearchParams(location.search).get("lang")||localStorage.getItem("qml_lang_"+u)||""; }catch(e){}
  if(!langs.includes(l)) l=langs.includes(LANG)?LANG:"en";
  setLang(l); window.scrollTo(0,0);
}

projReshuffle();
setUni(UNI);
loadPT();
