<title>EC&amp;EE—Machine — Environmental Comfort &amp; Energy Efficiency</title>

<style>
:root{
  --bg:#ffffff; --panel:#ffffff; --ink:#14171a; --ink2:#3d444b;
  --muted:#7b838b; --faint:#a8afb5; --line:#e3e6e2; --line2:#f0f2ee;
  --wash:#fafbf9; --good:#3f6212; --goodbg:#eaf3dd; --bad:#9f2420; --badbg:#fbe6e6;
  --c1:#2563EB;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-0.01em}
header{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hbar{display:flex;align-items:center;gap:18px;padding:10px 24px;max-width:1100px;margin:0 auto}
.brand{display:flex;align-items:baseline;gap:9px;flex:0 0 auto}
.brand b{font-size:15px;font-weight:650;letter-spacing:-0.015em}
.brand span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
.langsel,.kindsel{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff;flex:0 0 auto;margin-left:auto}
.langsel button,.kindsel button{font:inherit;font-size:11.5px;font-weight:600;letter-spacing:.03em;padding:4px 11px;border:none;background:#fff;color:var(--muted);cursor:pointer;border-right:1px solid var(--line2)}
.langsel button:last-child,.kindsel button:last-child{border-right:none}
.langsel button:hover,.kindsel button:hover{color:var(--ink);background:var(--wash)}
.kindsel+.langsel{margin-left:8px}
.langsel button[aria-pressed="true"],.kindsel button[aria-pressed="true"]{background:var(--ink);color:#fff}
nav.tabs{border-bottom:1px solid var(--line);background:#fff}
.tabs-inner{display:flex;gap:2px;padding:0 24px;max-width:1100px;margin:0 auto;overflow-x:auto}
.tab{appearance:none;background:none;border:none;font:inherit;font-size:13px;color:var(--muted);padding:11px 14px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink2)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.tab .n{font-family:var(--mono);font-size:10px;color:var(--faint);margin-right:6px}
main{max-width:1100px;margin:0 auto;padding:0 24px 44px}
section.page{display:none;padding-top:26px}
section.page.on{display:block}
.pagehead{margin-bottom:20px;max-width:760px}
.pagehead h2{font-size:19px;letter-spacing:-0.02em}
.pagehead p{margin:5px 0 0;color:var(--muted);font-size:13px}
.controls{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:9px;background:var(--wash);margin-bottom:16px}
.ctl{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2)}
.ctl>label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.07em}
.who{position:relative}
.sug{position:absolute;left:0;top:100%;z-index:20;min-width:100%;margin:4px 0 0;padding:4px 0;list-style:none;background:var(--panel,#fff);border:1px solid var(--line);border-radius:4px;box-shadow:0 6px 22px rgba(20,25,60,.14);max-height:260px;overflow:auto}
.sug li{padding:6px 10px;cursor:pointer;white-space:nowrap;font-size:12.5px}
.sug li span{color:var(--muted);font-family:var(--mono);margin-left:8px}
.sug li:hover,.sug li[aria-selected="true"]{background:var(--wash)}
.ctl input.ok{border-color:#2e7d32}
select,input[type=number],input[type=text],input[type=password]{font:inherit;font-size:12px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:5px;padding:4px 7px;max-width:230px}
select:focus,input:focus{outline:2px solid #cfd8ea;outline-offset:0;border-color:var(--c1)}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:12px;cursor:pointer;color:var(--ink2)}
.chk input{accent-color:var(--ink);margin:0}
.btn{font:inherit;font-size:12px;color:var(--ink2);background:#fff;border:1px solid var(--line);border-radius:6px;padding:5px 11px;cursor:pointer;transition:border-color .12s,color .12s,background .12s}
.btn:hover{border-color:#c6cbc4;color:var(--ink);background:var(--wash)}
.btn:active{background:#f2f4f0}
.btn.solid{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.solid:hover{background:#000;color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.panel{border:1px solid var(--line);border-radius:9px;background:var(--panel);overflow:hidden;margin-bottom:16px}
.panel-head{display:flex;align-items:flex-start;gap:14px;padding:12px 14px 10px;border-bottom:1px solid var(--line2)}
.panel-title{flex:1 1 auto;min-width:0}
.panel-title h3{font-size:13.5px}
.panel-title p{margin:2px 0 0;font-size:11.5px;color:var(--muted);line-height:1.45}
.panel-body{padding:14px;position:relative}
.qtext{font-size:16px;font-weight:600;letter-spacing:-0.01em;margin:0 0 12px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;font:inherit;font-size:13.5px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;color:var(--ink)}
.opt,.proj-opt{touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:border-color .12s,background .12s,box-shadow .12s}
@media(hover:hover){.opt:not(.sel):hover,.proj-opt:not(.sel):not(:disabled):hover{border-color:var(--c1);background:#f1f5fe}}
.opt:not(.sel):active,.proj-opt:not(.sel):not(:disabled):active{border-color:var(--c1);background:#e6eefd}
.opt.sel{border-color:var(--ink);background:var(--wash);box-shadow:0 0 0 1px var(--ink) inset}
.opt .L{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 7px;flex:0 0 auto;margin-top:2px}
.opt.sel .L{background:var(--ink);color:#fff;border-color:var(--ink)}
.opt.ok{border-color:var(--good);background:var(--goodbg)}
.opt.ko{border-color:var(--bad);background:var(--badbg)}
.qnav{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
.progress{height:6px;background:var(--line2);border-radius:3px;overflow:hidden;margin-bottom:14px}
.progress>i{display:block;height:100%;background:var(--ink);width:0%}
.meta{font-family:var(--mono);font-size:11px;color:var(--muted)}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:820px){.g3,.g4{grid-template-columns:1fr 1fr}}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:640px){.g2{grid-template-columns:1fr}}
.labslot .panel-head{align-items:center}
.labmem{margin:0 0 14px;font-size:13.5px;line-height:1.6}
.labmem .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.07em;margin-right:8px}
.labslot .panel-title p a,.labmx a{color:var(--ink)}
.labslot .ctl>label{white-space:nowrap}
.labslot input[type=url]{min-width:0}
@media(max-width:640px){.labslot .ctl{flex-wrap:wrap}.labslot input[type=url],.labslot input[type=file]{width:100%!important;min-width:0;flex:1 1 100%}}
.labmx th .btn{padding:3px 9px;font-size:11px;margin-top:4px}
.labmx td{white-space:nowrap}
.labmx .lpts{width:58px;margin-top:4px;font:inherit;font-size:12px;padding:2px 4px;text-align:right}
.labmx .lpts.ok{outline:2px solid var(--good)}.labmx .lpts.bad{outline:2px solid var(--bad)}
.roster summary{cursor:pointer;font-weight:600;padding:6px 0}
.roster h4{margin:12px 0 4px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.roster ul{margin:0 0 6px;padding-left:18px}.roster li{margin:2px 0}
.stat{border:1px solid var(--line);border-radius:9px;padding:13px 14px}
.stat .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stat .v{font-family:var(--mono);font-size:23px;font-weight:500;letter-spacing:-0.02em;margin-top:5px;color:var(--ink)}
.stat .v small{font-size:12px;color:var(--muted);font-weight:400;margin-left:3px}
.stat .s{font-size:11.5px;color:var(--muted);margin-top:3px}
.pill{display:inline-block;font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;padding:2px 7px;border-radius:4px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--goodbg);color:var(--good)}
.pill.bad{background:var(--badbg);color:var(--bad)}
.pill.idle{background:#f1f2ef;color:#7b838b}
.tbl-scroll{overflow-x:auto}
table.data{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
table.data th,table.data td{padding:6px 9px;text-align:left;border-bottom:1px solid var(--line2)}
table.data th{font-weight:600;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line)}
table.data td.num,table.data th.num{text-align:right;font-family:var(--mono);color:var(--ink2)}
table.data tbody tr:hover{background:var(--wash)}
table.data tr.trk td{background:var(--wash);font-weight:700;border-bottom:1px solid var(--line)}
.proj-q{font-size:26px;font-weight:650;letter-spacing:-0.02em;line-height:1.3;margin:6px 0 18px}
.proj-opts{display:grid;gap:10px;margin-bottom:8px}
.proj-opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font:inherit;font-size:17px;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:12px 16px;background:#fff;cursor:pointer}
.proj-opt:disabled{cursor:default}
.proj-opt .L{font-family:var(--mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 7px;flex:0 0 auto;margin-top:3px}
.proj-opt.sel{border-color:var(--ink);background:var(--wash);box-shadow:0 0 0 1px var(--ink) inset}
.proj-opt.sel .L{background:var(--ink);color:#fff;border-color:var(--ink)}
.proj-opt.reveal-ok{border-color:var(--good);background:var(--goodbg)}
.proj-opt.reveal-ok.sel{box-shadow:0 0 0 1px var(--good) inset}
.proj-opt.reveal-ok.sel .L{background:var(--good);border-color:var(--good)}
.proj-opt.reveal-ko{border-color:var(--bad);background:var(--badbg);box-shadow:0 0 0 1px var(--bad) inset}
.proj-opt.reveal-ko .L{background:var(--bad);border-color:var(--bad);color:#fff}
@media(max-width:640px){
  .hbar{padding:8px 12px;gap:10px}
  .brand{flex:1 1 auto;min-width:0;flex-wrap:wrap;row-gap:0}
  .brand b{font-size:13px}.brand span{font-size:9px}
  main{padding:0 12px 30px}
  .tabs-inner{padding:0 12px}
  .proj-q{font-size:20px}
  .proj-opt{font-size:15px;padding:10px 12px}
  .opt{font-size:14px;padding:10px 12px}
  .ptimer{font-size:18px}
  .controls{gap:8px 10px}
  .ctl{flex:1 1 100%}
  select,input[type=text],input[type=password]{max-width:none;width:100%}
  .stat .v{font-size:19px}
}
.hint{font-size:12px;color:var(--muted)}
table.trtab td{white-space:normal;vertical-align:top;width:48%}
table.trtab td.num{width:auto}
.trq{font-weight:600;margin-bottom:4px}
.tro{display:flex;gap:8px;color:var(--ink2)}
.tro .L{font-family:var(--mono);color:var(--muted)}
.tro.ok{color:var(--good);font-weight:600}
#b-trout [contenteditable]{border-radius:3px;outline:1px dashed transparent;outline-offset:1px}
#b-trout [contenteditable]:hover,#b-trout [contenteditable]:focus{outline-color:var(--c1);background:#f1f5fe}
.ptimer{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:-0.02em}
.ptimer.g{color:#4d7c0f}.ptimer.y{color:#b45309}.ptimer.r{color:var(--bad)}
.tbar{height:8px;background:var(--line2);border-radius:4px;overflow:hidden;margin:0 0 16px}
.tbar>i{display:block;height:100%;width:100%;transition:width .8s linear,background .4s}
.tbar>i.g{background:linear-gradient(90deg,#65A30D,#84cc16)}
.tbar>i.y{background:linear-gradient(90deg,#D97706,#f59e0b)}
.tbar>i.r{background:linear-gradient(90deg,#DC2626,#f87171)}
.bars{display:grid;gap:8px;margin:0 0 16px}
.barrow{display:grid;grid-template-columns:130px 1fr 60px;align-items:center;gap:10px}
.barrow .tbar{margin:0}
.barrow .bl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.barrow .bv{font-family:var(--mono);font-size:12px;color:var(--ink2);text-align:right}
@media(max-width:640px){.barrow{grid-template-columns:96px 1fr 48px;gap:8px}.barrow .bl{font-size:10px;letter-spacing:.04em}}
.overbanner{border:1px solid var(--bad);background:var(--badbg);color:var(--bad);border-radius:8px;padding:12px 14px;font-weight:600;margin-bottom:12px}
.reqpanel{border:1px dashed #c6cbc4;border-radius:8px;padding:12px 14px;margin-top:12px;background:var(--wash)}
footer{border-top:1px solid var(--line);margin-top:30px;padding:14px 0 30px;color:var(--muted);font-size:11.5px}
code.mono{font-family:var(--mono);font-size:11px;background:var(--wash);border:1px solid var(--line2);border-radius:4px;padding:1px 5px}
.hlogos{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.hlogo{width:64px;text-align:center;cursor:pointer;border-radius:10px;padding:4px 2px}
.hlogo svg{width:56px;height:56px;display:block;margin:0 auto}
.hlogo.grey svg{filter:grayscale(1) brightness(1.65);opacity:.55}
.hlogo.sel{outline:2px solid var(--ink)}
.hlogo .hc{font-size:10px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.hlogo.sel .hc{color:var(--ink);font-weight:700}
.hlogo.extra{cursor:default}
.hlogo.extra svg{filter:grayscale(1) brightness(1.9);opacity:.4}
input.pw{-webkit-text-security:disc;text-security:disc}
.leavebanner{margin:10px 0;padding:8px 12px;border-radius:10px;border:1px solid #e0a800;background:#fff6d6;color:#6b4e00;font-size:13px}

/* ===== Course-book theme: paper and ink, one ochre accent (matches the EC&EE Course Book) ===== */
:root{
  --bg:#f6f4ef; --panel:#fbfaf6; --ink:#1d2326; --ink2:#3b4246; --muted:#5b6468; --faint:#8d9497;
  --line:#d9d4c7; --line2:#e6e1d5; --wash:#ece8df; --nav:#ebe6da; --field:#fffdf8;
  --accent:#9a5b13; --accentbg:#f3e6d3; --onaccent:#fffdf8;
  --good:#3f6212; --goodbg:#e4eed3; --bad:#9f2420; --badbg:#f6dfdc;
  --c1:#9a5b13;
  --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#171b1d; --panel:#1c2124; --ink:#e8e6e1; --ink2:#cfccc5; --muted:#a2a9ab; --faint:#7b8386;
    --line:#33393c; --line2:#2a3033; --wash:#21262a; --nav:#1d2225; --field:#14181a;
    --accent:#e0a458; --accentbg:#3a2c18; --onaccent:#171b1d;
    --good:#a3c76a; --goodbg:#243019; --bad:#ef8a80; --badbg:#3a1f1d;
    --c1:#e0a458; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171b1d; --panel:#1c2124; --ink:#e8e6e1; --ink2:#cfccc5; --muted:#a2a9ab; --faint:#7b8386;
  --line:#33393c; --line2:#2a3033; --wash:#21262a; --nav:#1d2225; --field:#14181a;
  --accent:#e0a458; --accentbg:#3a2c18; --onaccent:#171b1d;
  --good:#a3c76a; --goodbg:#243019; --bad:#ef8a80; --badbg:#3a1f1d;
  --c1:#e0a458; color-scheme:dark;
}
body{background:var(--bg);color:var(--ink);font-family:var(--sans)}
header{background:var(--bg);backdrop-filter:none;border-bottom:1px solid var(--line)}
.booknav{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;font-size:12.5px;flex:0 0 auto}
.booknav a{font-weight:600;color:var(--muted);text-decoration:none;padding:.3rem .7rem;min-height:30px;display:inline-flex;align-items:center;cursor:pointer}
.booknav a:hover{color:var(--ink)}
.booknav a[aria-current="page"]{background:var(--accent);color:var(--onaccent);cursor:default}
@media (max-width:640px){.hbar{flex-wrap:wrap;gap:10px}.brand span{display:none}}
nav.tabs{background:var(--bg);border-bottom:1px solid var(--line)}
.brand b{font-family:var(--serif);font-size:17px;font-weight:700;letter-spacing:0}
.tab .n{color:var(--faint)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.langsel,.kindsel{background:transparent;border-color:var(--line);border-radius:4px}
.langsel button,.kindsel button{background:transparent;color:var(--muted);border-right-color:var(--line);min-height:30px}
.langsel button:hover,.kindsel button:hover{background:var(--wash);color:var(--ink)}
.langsel button[aria-pressed="true"],.kindsel button[aria-pressed="true"]{background:var(--accent);color:var(--onaccent)}
.pagehead h2{font-family:var(--serif);font-size:1.75rem;font-weight:700;letter-spacing:0;line-height:1.2}
.pagehead p{font-family:var(--serif);font-size:15px;font-style:italic;color:var(--muted)}
.controls{background:var(--nav);border-color:var(--line);border-radius:4px}
select,input[type=number],input[type=text],input[type=password],input[type=url]{background:var(--field);color:var(--ink);border-color:var(--line);border-radius:4px}
select:focus,input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.chk input{accent-color:var(--accent)}
.btn{background:transparent;color:var(--ink2);border-color:var(--line);border-radius:4px}
.btn:hover{background:var(--wash);color:var(--ink);border-color:var(--muted)}
.btn:active{background:var(--wash)}
.btn.solid{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:600}
.btn.solid:hover{background:var(--accent);color:var(--onaccent);filter:brightness(1.1)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--panel);border-color:var(--line);border-radius:6px}
.panel-head{border-bottom-color:var(--line2)}
.panel-title h3{font-family:var(--serif);font-size:16px;font-weight:700}
.qtext{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.35;letter-spacing:0}
.opt,.proj-opt{background:var(--field);color:var(--ink);border-color:var(--line);border-radius:4px}

anista numa região de monções tropicais está a desenvolver um parque no terraço para gerir chuvas intensas, inspirando-se na Quinta Urbana de Telhado da Universidade Thammasat (TURF). Ao imitar a agricultura tradicional em terraços, que métrica específica de desempenho biofílico funcional pode o planeador esperar alcançar em comparação com os telhados verdes planos convencionais?", "opts": ["Gerir o escoamento das águas pluviais até 20 vezes mais eficientemente, criando uma paisagem fractal produtiva.", "Diminuindo a temperatura ambiente do efeito ilha de calor urbana da superfície em um mínimo de 15°C.", "Capturando 70% da carga de arrefecimento necessária do edifício através de arrefecimento passivo por evaporação descendente.", "Reduzir o consumo total de energia do edifício em exatamente 25% através de um isolamento melhorado do telhado."], "a": 0}, {"q": "Contexto: Uma equipa de design pretende ir além da ideia teórica de \"uma ligação inata à natureza\" para uma aplicação estrita e avaliativa para um novo complexo de escritórios. De quem é a estrutura fundamental, definida por 6 princípios e mais de 70 atributos, que a equipa deve adotar para satisfazer sistematicamente a necessidade biologicamente codificada de se ligar à natureza?", "opts": ["Estrutura de design biofílico de Stephen Kellert (2008).", "Hipótese da biofilia de E.O. Wilson (1984).", "A abordagem holística e integrada de Elizabeth Calabrese (2015).", "Princípios de arrefecimento passivo de Hassan Fathy (1948)."], "a": 0}, {"q": "Contexto: Num design restaurativo de jardim, um arquiteto paisagista pretende integrar o azulejo como um aspeto de \"Natureza Indireta\". De acordo com os princípios biofílicos demonstrados no Alcázar de Sevilha, que função psicológica específica desempenha esta pavimentação tradicional?", "opts": ["Melhora a absorção sonora ao reduzir o eco de alta frequência em pátios fechados.", "Simula diretamente os quatro rios simbólicos do Paraíso através de linhas retangulares es s": ["Uma eliminação completa a 100% do carbono incorporado.", "Uma redução das emissões exatamente de 15%.", "Uma redução das emissões até 70%.", "Uma redução das emissões até 90%."], "a": 2}, {"q": "Contexto: A sede do Apple Park, concebida pela Foster + Partners, funciona como um design biointegrado em grande escala. Ao utilizar os maiores painéis de vidro curvos para desfocar os limites interiores e exteriores, durante que percentagem do ano o edifício é capaz de depender inteiramente da ventilação natural?", "opts": ["Até 70% do ano.", "Até 30% do ano.", "Até 90% do ano.", "Exatamente 25% do ano."], "a": 0}, {"q": "Contexto: Uma empresa imobiliária comercial está a debater o retorno do investimento para incorporar extensas características biofílicas, como fluxo interior-exterior e claraboias, num novo centro comercial. Com base em estudos do setor (por exemplo, Miller 2018, Kats 2003, Terrapin Bright Green 2012), quais são os prémios económicos estabelecidos associados a estes designs?", "opts": ["20% mais valor da propriedade, 70% poupança de energia e aumento de 15% na retenção de inquilinos.", "15% mais valor da propriedade, poupança de energia de 25% e aumento de 20% na retenção de inquilinos.", "25% mais valor da propriedade, 15% poupança de energia e 30% aumento na retenção de inquilinos.", "10% mais valor da propriedade, 90% poupança de energia e 25% aumento na retenção de inquilinos."], "a": 1}, {"q": "Contexto: Conceber para cuidados de saúde pediátricos requer integração sensível de elementos biofílicos. No Princess Máxima Center for Pediatric Oncology, que característica arquitetónica específica defende o 'Cuidado Centrado na Família' e reduz a ansiedade do paciente?", "opts": ["Implementação de acabamentos de parede à base de micélio para garantir a absorção absoluta do som nas alas pediátricas.", "A utilização de uma chaminé solar de 24 andares para maximizar a luz dinâmica e difusa em todas as salas de tratamento.", "Acesso direto aos jardins no telhado a partir das 'sky suites' para pacientes para proporcionar exposição e autonomia críticas ao ar livre.", "Um jardim botânico interior central de 70.000 metros quadrados, entrelaçado com espaços de circulação médica."], "a": 2}, {"q": "Contexto: A Casa BIQ em Hamburgo utiliza uma fachada inovadora inspirada no \"Efeito Folha de Lótus\" e na Biomimética funcional. Para além da autolimpeza, qual é a principal vantagem operacional desta ecologia viva e produtiva integrada na estrutura do edifício?", "opts": ["Utiliza um sistema hidropónico para cultivar culturas comestíveis para os residentes.", "Cultiva algas para colher biocombustível e gerir o ganho solar.", "Capta a água da chuva para gerir 100% das necessidades de água cinzenta do edifício.", "Proporciona um amortecimento acústico extremo, criando Zonas de Silêncio internas numa área urbana movimentada."], "a": 1}, {"q": "Contexto: Um arquiteto paisagista está a desenhar dois jardins distintos: um inspirado nas tradições Mughal do século XVII e outro nos Jardins de Chá Japoneses do século XV (Roji). Que contraste fundamental de design deve o arquiteto estabelecer entre os dois?", "opts": ["O jardim Mughal deveria usar pavimentos refletores de alto albedo, enquanto o jardim japonês deveria usar muros de Terra Batida para massa térmica.", "O jardim Mughal deve depender fortemente do humilde bambu e da madeira, enquanto o jardim japonês deve usar grandes terraços de pedra e canais de água que representem rios.", "O jardim Mughal deve usar passadiços retangulares e cruzados (Charbagh), enquanto o jardim japonês utiliza pedras de degrau para criar uma transição lenta, meditativa e imperfeita.", "O jardim Mughal foi concebido puramente para uma transitoriedade orgânica e caótica, enquanto o jardim japonês baseia-se numa simetria renascentista rígida."], "a": 2}, {"q": "Contexto: O Centro Nacional de Aquatics de Pequim (Cubo de Água) otimiza a luz dinâmica e difusa para melhorar o bem-estar. Que geometria natural específica, imitando bolhas e espuma, foi aplicada às almofadas leves de ETFE para alcançar esta eficiência estrutural?", "opts": ["A geometria de Weaire–Phelan.", "O padrão de tesselação Voronoi.", "A sequência espiral de Fibonacci.", "A geometria fractal de Chahar Bagh."], "a": 0}, {"q": "Contexto: Um edifício de escritórios visa maximizar a Conexão Visual Contínua com a Natureza, prevenindo o brilho solar, levando os arquitetos a especificar o SageGlass. Como é que esta tecnologia eletrocrómica apoia especificamente a saúde dos trabalhadores de acordo com os princípios da engenharia biofílica?", "opts": ["Depende do arrefecimento passivo evaporativo por corrente descendente para baixar as temperaturas da superfície do vidro durante o pico do sol da tarde.", "Simula padrões de luz natural usando software impulsionado por IA, permitindo que os ocupantes experimentem transitoriedade mesmo em divisões interiores sem janelas.", "Utiliza um sistema hidropónico integrado para filtrar o ar urbano e reduzir o efeito de ilha de calor urbana através das janelas do edifício.", "Tinge dinamicamente para controlar o calor e o brilho sem usar persianas, estabilizando a exposição à luz para regular os ritmos circadianos e melhorar a função cognitiva."], "a": 3}, {"q": "Contexto: Manitoba Hydro Place está localizada num clima extremo com temperaturas até -35°C. Apesar do exterior gelado, que característica arquitetónica específica permite ao edifício utilizar com segurança a ventilação natural e a luz dinâmica em todo o seu espaço de planta profunda?", "opts": ["Vidro inteligente eletrocromático que retém 100% da energia solar radiante no inverno.", "Uma parede central massiva de terra batida de massa térmica que absorve calor durante todo o ano.", "Telhados Verdes fortemente isolados integrados diretamente na paisagem envolvente.", "Uma chaminé solar de 24 andares combinada com jardins de inverno que filtram a luz."], "a": 3}, {"q": "Contexto: As diretrizes arquitetónicas pós-pandemia enfatizam estratégias para mitigar a transmissão aérea de doenças. De acordo com as lições apresentadas nos quadros de design biofílico, que métrica específica de ventilação reduz significativamente o risco de transmissão?", "opts": ["Aumentar as taxas de troca de ar para alcançar 6x Ventilação.", "Fornecendo pelo menos 30% da área total como espaço fechado do Refúgio.", "Projetando 75% dos corredores internos com brisas naturais cruzadas.", "A substituir sistemas HVAC padrão por arrefecimento 100% passivo por corrente descendente."], "a": 0}, {"q": "Contexto: Um designer está a adaptar um escritório em plano aberto e pretende introduzir estímulos sensoriais não rítmicos, ao mesmo tempo que melhora a acústica. Se o designer escolher materiais à base de micélio (cultivados a partir de fungos), que combinação única de benefícios oferece isto em relação aos painéis acústicos sintéticos?", "opts": ["São altamente biodegradáveis, requerem pouca energia para serem produzidas e oferecem uma textura natural única juntamente com excelente absorção acústica.", "Eles colhem ativamente biocombustível do ar interior enquanto absorvem até 70% do ruído de baixa frequência dos escritórios.", "Replicam a resistência estrutural da madeira laminada cruzada, servindo como massa térmica primária.", "Proporcionam arrefecimento passivo evaporativo contínuo através da libertação de esporos fúngicos no ar."], "a": 0}, {"q": "Contexto: No design da High Line em Nova Iorque, os arquitetos paisagistas utilizaram a elevação para alterar a experiência pedonal. Como é que este parque linear elevado cumpre especificamente a configuração espacial biofílica do \"Prospect\"?", "opts": ["Criando um espaço protegido e seguro para retiro e relaxamento, longe do caos urbano.", "Introduzindo elementos que sugerem perigo, como pavimentos de vidro, sem representar uma ameaça real.", "Incorporando caminhos obscuros e sinuosos que convidam à exploração e sugerem o desconhecido.", "Proporcionando uma visão desimpedida para visão e controlo, o que induz uma sensação psicológica de segurança."], "a": 3}, {"q": "Contexto: Um aluno está confuso quanto à diferença entre Biomimetismo e Formas Biomórficas. Qual dos emparelhamentos seguintes distingue corretamente os dois conceitos aplicados no Eastgate Centre e na Allen Lambert Galleria?", "opts": ["O Centro Eastgate utiliza Biomimetismo para recolher água da chuva; a Allen Lambert Galleria utiliza Formas Biomórficas para cultivar algas como biocombustível.", "Ambos os edifícios utilizam exclusivamente Biomimetismo, pois ambos dependem de geometrias naturais para reduzir as emissões de carbono em 70%.", "O Centro Eastgate utiliza Biomimetismo replicando funcionalmente a ventilação de térmitas; a Allen Lambert Galleria utiliza Formas Biomórficas ao imitar visualmente copas florestais ramificadas.", "O Centro Eastgate utiliza Formas Biomórficas ao assemelhar-se visualmente a um montículo de térmitas; a Allen Lambert Galleria utiliza a Biomimetismo ao funcionar estruturalmente exatamente como uma árvore viva."], "a": 2}, {"q": "Contexto: Durante a fase de conceção esquemática, uma equipa interdisciplinar utiliza DIVA-for-Rhino para avaliar um novo design de biblioteca. Que aspeto específico de desempenho biofílico simula esta ferramenta computacional para ajudar na tomada de decisão da equipa?", "opts": ["Calcula a redução exata do carbono incorporado ao mudar de aço para madeira laminada cruzada.", "Simula padrões de luz natural e reflexo para otimizar a geometria da fachada para uma exposição ótima à luz do dia.", "Prevê os padrões de crescimento e as necessidades de nutrientes das fachadas vivas hidropónicas ao longo de um ciclo de 10 anos.", "Modela os coeficientes de absorção sonora acústica de vários painéis de parede à base de micélio."], "a": 1}, {"q": "Contexto: Menara Mesiniaga (1992) de Ken Yeang estabeleceu o conceito de um \"lar para árvores e aves que também alberga humanos.\" Ao alojar mais de 20.000 plantas num ambiente urbano denso, que benefícios ambientais macro específicos são alcançados juntamente com a ligação visual entre humanos e natureza?", "opts": ["Colher 100% da energia necessária do edifício através de folhas biomiméticas fotovoltaicas.", "Gerir o escoamento das águas pluviais 20 vezes mais eficientemente do que os telhados planos normais.", "Mitigar o smog urbano, regular a temperatura dos edifícios e aumentar significativamente a biodiversidade local.", "Fornecendo rendimento agrícola suficiente para alimentar 30% dos ocupantes do edifício."], "a": 2}, {"q": "Contexto: As Esferas Amazónicas em Seattle albergam mais de 40.000 plantas num microclima exuberante e húmido. Do ponto de vista cognitivo e psicológico, qual é o principal propósito biofílico de submeter os trabalhadores a este ambiente botânico de alta densidade?", "opts": ["Proporcionar exposição intensa a Estímulos Sensoriais Não Rítmicos e Conexão Visual com a Natureza, que reduz diretamente o stress e melhora a função cognitiva.", "Para imitar o risco de transitoriedade e perigo percebido, mantendo os colaboradores altamente alertas e aumentando a produção bruta.", "Atuar como um extenso gerador de biocombustível interior que compense os custos energéticos do campus corporativo circundante.", "Para servir como uma Zona de Silêncio isolada onde o ruído branco das fontes de água mascara completamente os sons da cidade."], "a": 0}, {"q": "Contexto: A SDE4 em Singapura é o primeiro edifício de energia líquida zero do Sudeste Asiático. Que configuração estrutural e espacial lhe permite maximizar a função cognitiva através da Luz Natural sem depender fortemente do arrefecimento artificial num clima tropical?", "opts": ["Utiliza uma estrutura de planta profunda combinada com Ventilação Natural e amplos telhados verdes.", "Utiliza uma chaminé solar de 24 andares para puxar ar através de uma fachada geométrica Weaire-Phelan.", "Utiliza um enorme telhado de betão biomórfico para sombrear permanentemente 90% do interior do edifício.", "Depende inteiramente de paredes de Terra Batida para fornecer massa térmica e arrefecimento passivo extremo."], "a": 0}, {"q": "Contexto: Um arquiteto paisagista desenha um parque com um caminho sinuoso oculto por ervas altas (Característica A) e um pavilhão que projeta sombras dramaticamente mutáveis à medida que o sol se move (Característica B). De acordo com os princípios da \"Natureza do Espaço\", como são classificadas estas duas características?", "opts": ["A Característica A representa Mistério; A característica B representa a Transitoriedade.", "A Característica A representa o Refúgio; A Característica B representa o Prospecto.", "A Característica A representa a Transitoriedade; A Característica B representa o Mistério.", "A Característica A representa o Risco Percebido; A Característica B representa Complexidade Organizada."], "a": 0}, {"q": "Contexto: À medida que a arquitetura biofílica evolui, a inteligência artificial está cada vez mais integrada na gestão de edifícios. De acordo com as tendências futuras no design biofílico, como é que os algoritmos de Aprendizagem Automática irão otimizar especificamente a manutenção de \"Sistemas Vivos\" como as paredes verdes hidropónicas?", "opts": ["Mudando dinamicamente a orientação física do edifício para captar a maior luz natural possível.", "Monitorizando e prevendo em tempo real as necessidades específicas de saúde e nutrientes das plantas vivas.", "Simulando a ramificação evolutiva de estruturas dendriformes para gerar automaticamente planos arquitetónicos.", "Modificando geneticamente as plantas para se auto-limparem e repelirem a terra, usando o efeito da folha de lótus."], "a": 1}, {"q": "Contexto: Um administrador hospitalar está a avaliar uma proposta de redesenho de uma enfermaria de recuperação pós-operatória. Baseando-se diretamente na investigação fundamental de Ulrich (1984), qual é a intervenção biofílica mais cientificamente validada que o arquiteto deveria exigir para alcançar reduções mensuráveis no tempo de recuperação dos doentes?", "opts": ["Utilização de painéis acústicos à base de micélio para reduzir o ruído ambiente hospitalar até 70%.", "Garantir que cada quarto do paciente tem uma ligação visual direta à natureza através de vistas para janelas.", "Implementação de um sistema dinâmico de iluminação circadiana 24 horas em todas as divisões interiores sem janelas.", "Proporcionando acesso direto a jardins sensoriais no telhado através de suites aéreas para pacientes."], "a": 1}, {"q": "Contexto: Um arquiteto está a desenhar um retiro no deserto inspirado no trabalho de Rick Joy e Hassan Fathy. O cliente exige um sistema passivo de controlo de temperatura de baixo carbono que também proporcione uma Relação Baseada no Lugar profunda. Como é que especificar terra batida cumpre explicitamente estes requisitos técnicos biofílicos?", "opts": ["Incorpora materiais de mudança de fase que mudam fisicamente de estado a 25°C para eliminar completamente a necessidade de arrefecimento mecânico.", "A sua estrutura altamente porosa permite o arrefecimento passivo por evaporação descendente quando combinado com um Malqaf.", "Imita a geometria fractal de um dossel florestal, permitindo que as paredes canalizem ativamente as brisas elevadas para o interior.", "A sua massa térmica significativa absorve calor durante o dia e liberta-o à noite, proporcionando refúgio térmico enquanto utiliza solos locais de baixo carbono."], "a": 3}, {"q": "Contexto: Um engenheiro estrutural na Áustria está a especificar materiais para um edifício comercial de altura média. O promotor pretende substituir o aço e betão padrão por Madeira Laminada Cruzada (CLT) para atingir metas específicas ESG (Ambientais, Sociais e de Governação). Que benefício dual funcional e biofílico oferece a CLT?", "opts": ["Captura 100% do escoamento da água da chuva devido à sua densa estrutura celular, atuando como uma enorme bateria térmica.", "Reduz significativamente as emissões de carbono em comparação com o betão, enquanto o seu veio visível da madeira atua como um Análogo Natural para melhorar a redução do stress dos ocupantes.", "Utiliza um revestimento biomimético de folha de lótus para autolimpeza, reduzindo o carbono incorporado em 90%.", "Cultiva algas nas suas camadas estruturais para a captação de biocombustíveis, proporcionando uma elasticidade estrutural incomparável."], "a": 1}, {"q": "Contexto: Ao desenhar o Hospital Khoo Teck Puat (KTPH) em Singapura, a CPG Consultants priorizou o conceito de \"Hospital num Jardim\". Do ponto de vista de sistemas sustentáveis, como é que a KTPH integra a sua paisagem biofílica para além da mera estética visual?", "opts": ["Os jardins integrados funcionam como elementos ativos do ecossistema, trabalhando em conjunto com a Ventilação Natural para arrefecer a instalação de forma sustentável.", "O hospital depende de um lago artificial central para fornecer 100% do seu arrefecimento através de um sistema geotérmico de circuito fechado.", "Os jardins são construídos inteiramente com compósitos biodegradáveis que se decompõem em segurança e regressam à natureza após um ciclo de vida de 50 anos.", "Utiliza um enorme telhado de almofada de ETFE para captar luz natural dinâmica, eliminando a necessidade de iluminação artificial em todos os espaços clínicos."], "a": 0}, {"q": "Contexto: Inspirado em Southwest Montgomery Green Street, de Kevin Robert Perry, um urbanista propõe integrar jardins de chuva e bioswales num corredor do centro muito movimentado. Qual é o principal propósito ecológico funcional de tornar estes sistemas naturais visivelmente curvos e em camadas?", "opts": ["Filtrar ativamente os poluentes urbanos do escoamento das águas pluviais, ao mesmo tempo que cria uma experiência pedonal mais calma e pedonal.", "Para conseguir uma redução de 25% na temperatura ambiente geral das ruas através de sombras extremas.", "Para imitar a geometria rigorosamente retilínea e intersectável de um Charbagh Mogol tradicional.", "Para aumentar o valor das propriedades comerciais das lojas adjacentes em 20% garantido."], "a": 0}, {"q": "Contexto: O projeto de habitação Kronsberg Zero-Energy na Alemanha integra extensos espaços verdes partilhados no seu plano diretor. De acordo com os quadros da psicologia ambiental (por exemplo, Sanoff, 2000), porque é que o \"Design Participativo\" destes jardins comunitários é crucial para o sucesso social a longo prazo do projeto?", "opts": ["Exige que os residentes possuam legalmente e mantenham uma percentagem específica da infraestrutura do telhado verde, compensando os impostos municipais.", "Envolve ativamente as comunidades locais nas fases de planeamento e implementação, o que fortalece os laços sociais e garante que os espaços respondam às necessidades reais dos residentes.", "Depende do rastreamento biométrico por IA para monitorizar as interações dos residentes e adaptar automaticamente o layout da paisagem ano após ano.", "Liga os residentes estritamente aos ciclos alimentares agrícolas, exigindo que a comunidade produza 30% da sua própria alimentação."], "a": 1}, {"q": "Contexto: O Empreendimento de Uso Misto Viertel Zwei em Viena foi construído em torno de um grande lago artificial e prioriza zonas livres de carros. De acordo com os quadros biofílicos urbanos, que benefício psicológico específico é diretamente amplificado por esta organização espacial em grande escala?", "opts": ["O fomento de um forte sentido de comunidade e a promoção da interação social através da remoção de barreiras rodoviárias em espaços verdes partilhados.", "O mascaramento completo de todo o ruído urbano através de ruído branco constante e de alto volume proveniente da fonte central do lago.", "Uma sensação aumentada de Risco Percebido através da exposição desimpedida dos peões ao lago artificial.", "Uma dependência estrita das Formas Biomórficas para ditar o fluxo do tráfego de veículos de emergência."], "a": 0}, {"q": "Contexto: Um distrito escolar está a auditar projetos arquitetónicos para uma nova escola primária. Com base nas conclusões do Heschong Mahone Group (2003), que resultado operacional preciso pode o distrito esperar se maximizar a iluminação natural dinâmica em todas as salas de aula?", "opts": ["A eliminação completa da necessidade de iluminação artificial durante 90% do ano letivo.", "Uma redução garantida de 25% nos problemas comportamentais e absentismo dos alunos.", "Uma redução de 70% nos custos totais de manutenção do edifício ao longo de um ciclo de vida de 10 anos.", "Uma melhoria mensurável no desempenho académico dos alunos ligada diretamente à exposição à luz do dia."], "a": 3}, {"q": "Contexto: PT Bambu desenhou a Escola Verde em Bali, utilizando enormes estruturas de bambu ao ar livre. Para além da sustentabilidade material, como é que a ausência deliberada de paredes e o uso de formas biomórficas impactam de forma única o ambiente pedagógico?", "opts": ["Cria um sentido fortemente guardado de Refúgio, limitando severamente as vistas para manter os alunos muito focados nas suas secretárias.", "Obriga os alunos a confiar em tecnologias eletrocrómicas para gerir o brilho tropical durante as horas de maior movimento.", "Facilita a aprendizagem experiencial e cria vastas salas de aula ao ar livre que ligam os alunos diretamente à ecologia da selva.", "Utiliza a estrutura celular densa do bambu para proporcionar o máximo isolamento acústico do ruído da selva circundante."], "a": 2}, {"q": "Contexto: Os Arquitetos VMDO integraram diversas áreas de aprendizagem ao ar livre e jardins comestíveis na Discovery Elementary School em Arlington. Qual é o duplo propósito biofílico e educativo destes pátios verdes específicos de escolas?", "opts": ["Funcionam como um sistema passivo de controlo climático biomimético, arrefecendo naturalmente as salas de aula através de evapotranspiração intensiva.", "Funcionam inteiramente como um amortecedor visual estético para esconder os painéis solares de energia líquida zero da vista da rua.", "Promovem a atividade física e facilitam a educação baseada na natureza, ligando diretamente os alunos aos ciclos agrícolas.", "Eles captam 100% do escoamento das águas pluviais do local, gerindo-o 20 vezes de forma mais eficiente do que as lagoas de retenção padrão."], "a": 2}, {"q": "Contexto: O Centro para Paisagens Sustentáveis em Pittsburgh é uma instalação de água líquida zero. Como é que o seu design regenerativo gere especificamente as águas residuais ao mesmo tempo que proporciona benefícios cognitivos biofílicos aos investigadores?", "opts": ["Bombeando águas residuais através de uma chaminé solar de 24 andares para as evaporar passivamente para a alta atmosfera.", "Encaminhando todas as águas residuais através de uma zona húmida exterior integrada, tornando o ciclo natural de purificação visível e acessível.", "Utilizando sistemas HVAC inteligentes impulsionados por IA para vaporizar águas residuais e humidificar o ambiente interior.", "Cultivando algas na fachada do edifício para consumir todos os resíduos biológicos enquanto gera biocombustível renovável."], "a": 1}, {"q": "Contexto: A Casa Ktima da K-Studio na Grécia utiliza fortemente paredes de pedra locais e está profundamente integrada no terreno inclinado. Que configuração espacial específica e princípio biofílico estão predominantemente em jogo neste desenho?", "opts": ["Relações Baseadas no Refúgio e no Lugar, utilizando terreno natural e materiais locais para criar um lar protegido e profundamente contextual.", "Transitoriedade e Biomimetismo, utilizando ecrãs de sombreamento dinâmicos que rastreiam automaticamente o sol do Egeu.", "Estímulos Sensoriais Não Rítmicos, impulsionados pela expansão térmica imprevisível das paredes de pedra.", "Complexidade Organizada e Risco Percebido, alcançados ao forçar os habitantes a navegar por precipícios íngremes e desprotegidos."], "a": 0}, {"q": "Contexto: A Floresta Vertical (Bosco Verticale) de Stefano Boeri em Milão alberga mais de 20.000 plantas nas suas torres residenciais. Para além da ligação visual, que benefícios macroecológicos precisos oferece este ecossistema vertical de alta densidade ao ambiente urbano?", "opts": ["Filtra fisicamente até 90% de todos os microplásticos do abastecimento de água municipal antes de entrarem no edifício.", "Mitiga o smog urbano, regula a temperatura ambiente local e aumenta significativamente a biodiversidade urbana.", "Cria um microclima localizado que permite ao edifício desligar-se completamente da rede elétrica da cidade.", "Utiliza vasos geométricos Weaire-Phelan para captar e reciclar 100% das águas cinzentas das torres."], "a": 1}, {"q": "Contexto: O projeto 1000 Trees do Heatherwick Studio em Xangai apresenta colunas estruturais maciças que se abrem no topo para suportar extensos vasos. Esta abordagem estrutural é um exemplo claro de:", "opts": ["Uma estrita adesão ao traçado de pedras de degrau Roji para retardar o movimento dos peões.", "A geometria Weaire-Phelan aplicada para maximizar a luz dinâmica através de almofadas ETFE.", "Implementação de um sistema passivo de arrefecimento evaporativo por corrente descendente nos núcleos das colunas.", "Utilizar estruturas dendriformes (ramificadas) para proporcionar tanto resistência estrutural como uma estética naturalista e biomórfica."], "a": 3}, {"q": "Contexto: A Nova Aldeia Gourna (1948) de Hassan Fathy no Egito utiliza construção tradicional de terra e elementos arquitetónicos específicos para sobreviver a temperaturas extremas do deserto. Que ligação de sistema natural é que Fathy explora explicitamente usando Malkaf (Torres de Vento)?", "opts": ["Ele liga-se à energia solar, usando as torres para focar a luz solar numa bateria central de massa térmica.", "Ele liga-se à geometria fractal da natureza, usando as torres para dispersar luz dura em padrões dinâmicos e difusos.", "Ele liga-se a sistemas de água subterrâneos, usando as torres para extrair humidade para hidroponia interior.", "Ele liga-se ao ar, capturando brisas elevadas para arrefecer o interior e fornecer um refúgio térmico crucial."], "a": 3}, {"q": "Contexto: Em climas extremamente frios como Lillehammer, Noruega (-20°C e abaixo), a Academia Nansen depende de telhados verdes fortemente isolados integrados diretamente na paisagem. Que métrica dual de desempenho biofílica e física é que estes telhados satisfazem?", "opts": ["Utilizam revestimentos biomiméticos de folhas de lótus para eliminar a neve instantaneamente, mantendo um albedo altamente refletor.", "Gerem as águas pluviais até 20 vezes de forma mais eficiente, eliminando a necessidade de amortecimento acústico interno.", "Proporcionam um desempenho térmico superior (isolamento) em invernos gelados, garantindo uma ligação visual constante com a Natureza.", "Cultivam ativamente culturas comestíveis durante todo o ano, imitando visualmente as Luzes Boreales através de vidro estrutural."], "a": 2}, {"q": "Contexto: O Aeroporto Jewel Changi da Safdie Architects apresenta o Vórtice da Chuva, uma enorme cascata central. Num centro de trânsito movimentado e de alta pressão, que função acústica e psicológica primária desempenha este elemento altamente engenheirado da Natureza Direta?", "opts": ["Serve como uma enorme funcionalidade de mascaramento de ruído, usando ruído branco para cobrir sons disruptivos do terminal enquanto reduz visualmente o stress.", "Fornece 100% do arrefecimento por evaporação da instalação, eliminando a necessidade de ar condicionado mecânico nos trópicos.", "Funciona como uma bateria principal de captação de água da chuva, contendo água suficiente para sustentar o aeroporto durante 6 meses sem chuva.", "Cria uma sensação de Risco Percebido que mantém os viajantes altamente alertas, reduzindo a probabilidade de voos perdidos."], "a": 0}, {"q": "Contexto: Casa das Canoas (1951), de Oscar Niemeyer, integra-se perfeitamente com o ambiente de selva brasileira envolvente. A característica arquitetónica mais marcante — o enorme telhado de betão livre — atua como que tipo de elemento biofílico?", "opts": ["Um Análogo Natural estrito que imita diretamente a geometria retilínea de um jardim tradicional de Charbagh.", "Um Absorvedor de Som acústico feito inteiramente de compósitos biodegradáveis à base de micélio.", "Uma Forma Biomórfica que flui organicamente em torno de blocos e vegetação pré-existentes, garantindo uma ligação visual constante à natureza.", "Um sistema explícito de controlo climático biomimético que replica a transpiração das folhas do dossel da selva."], "a": 2}, {"q": "Contexto: Fallingwater, de Frank Lloyd Wright, é uma obra-prima das Relações Baseadas no Lugar. Ao colocar a estrutura em balanço diretamente sobre uma cascata, que condição sensorial biofílica específica é estabelecida como o centro constante da casa?", "opts": ["Um fenómeno visual da Transitoriedade criado pelas sombras móveis projetadas pelas saliências profundas do telhado.", "Uma exposição contínua a estímulos sensoriais não rítmicos através do som e movimento sempre presentes da água a correr.", "Uma ligação estritamente olfativa, impulsionada pelo cheiro a terra húmida e musgo atravessados pelo sistema HVAC.", "Uma sensação avassaladora de mistério causada pela incapacidade de ver a cascata a partir dos espaços habitacionais principais."], "a": 1}, {"q": "Contexto: Na sede do Google Bay View projetada pela BIG e Heatherwick Studio, o enorme espaço aberto sob um telhado ondulante apresenta desafios acústicos significativos. Qual é a principal estratégia biofílica utilizada para manter a Função Cognitiva e o foco?", "opts": ["O uso de partições eletrocrómicas eletrocrômicas com cancelamento de ruído e impulsionadas por IA que se adaptam dinamicamente a níveis de decibéis em tempo real.", "O uso extensivo de materiais naturais como a madeira para proporcionar absorção sonora natural, juntamente com Zonas de Silêncio estrategicamente colocadas para restauro mental.", "A eliminação total de todas as superfícies duras, substituindo-as por biowalls vivas e hidropónicas.", "A implementação de uma cascata central interior de 24 andares para mascarar completamente todas as conversas colaborativas com ruído branco."], "a": 1}, {"q": "Contexto: A Academia de Ciências da Califórnia (Renzo Piano, 2008) apresenta um enorme telhado vivo de 1,42 hectares. Como é que as formas únicas das cúpulas (Formas Biomórficas) deste telhado contribuem estritamente para a estratégia de energia passiva do edifício?", "opts": ["Funcionam como enormes defletores acústicos, silenciando completamente o ruído vindo do Golden Gate Park circundante.", "Eles canalizam brisas elevadas para um labirinto geotérmico subterrâneo para pré-arrefecimento.", "Facilitam a ventilação passiva natural ao puxar o ar quente para cima e para fora através de claraboias automatizadas no topo das cúpulas.", "Refletem 90% da energia solar radiante de volta para a atmosfera através de um revestimento biomimético de lótus."], "a": 2}, {"q": "Contexto: O Genzyme Center (2004) utiliza um átrio central complexo para trazer luz natural profundamente para o seu núcleo. De acordo com os princípios biofílicos, de que forma esta manipulação específica da luz, utilizando espelhos e prismas, beneficia os ocupantes?", "opts": ["Imita artificialmente a aparência visual de um dossel florestal, satisfaz a necessidade de Formas Biomórficas num ambiente altamente urbano.", "Cria um brilho constante e de alta intensidade que força os ocupantes a ocuparem zonas de refúgio designadas e sombreadas, promovendo a colaboração espontânea.", "Cria padrões intencionais e dinâmicos de Luz e Sombra que apoiam os ritmos circadianos e melhoram a Função Cognitiva em escritórios de plano profundo.", "Elimina completamente a pegada de carbono do edifício ao captar radiação solar suficiente para alimentar todos os servidores internos."], "a": 2}, {"q": "Contexto: Ao examinar as lições das pandemias recentes aplicadas à arquitetura biofílica, é dada uma ênfase significativa à mitigação da transmissão aérea. Embora o design 75% sem toque ajude a reduzir a contaminação superficial, que padrão numérico específico é recomendado para a troca de ar para reduzir significativamente a transmissão da doença?", "opts": ["Implementação de arrefecimento evaporativo passivo por corrente descendente a 100%.", "Aumentar as taxas de troca de ar para alcançar 6x Ventilação.", "Alcançando uma redução de 30% na humidade ambiente total.", "Proporcionando exatamente 400 pés quadrados de espaço exterior acessível por ocupante."], "a": 1}, {"q": "Contexto: Uma cidade está a reformular os seus códigos municipais de construção para combater o efeito da Ilha de Calor Urbana (UHI). De acordo com as estratégias urbanas biofílicas estabelecidas, qual combinação de intervenções físicas proporciona a redução térmica mais direta?", "opts": ["Substituir todo o aço estrutural por Madeira Laminada Cruzada (CLT) para reduzir o carbono incorporado em 70%.", "Implantação de telhados verdes generalizados, expansão das copas das árvores para sombra e evapotranspiração, e utilização de pavimentos refletores de alto albedo.", "Construção de chaminés solares de 24 andares em todos os arranha-céus comerciais para expulsar o calor ao nível do solo para a alta atmosfera.", "Instalação de painéis extensos à base de micélio e transição para energia geotérmica 100% renovável."], "a": 1}, {"q": "Contexto: Um promotor rotulou um novo arranha-céu como \"Biofílico\" simplesmente colocando plantas em vasos no átrio, enquanto o edifício depende fortemente de betão de alto carbono e ambientes mecânicos selados. De acordo com as críticas ao design biofílico (por exemplo, Gifford, 2011), qual é a principal falha ética desta abordagem?", "opts": ["Não utiliza monitorização ambiental avançada baseada em IA para monitorizar a saúde das instalações do átrio.", "Viola os princípios geométricos rigorosos da estrutura de Stephen Kellert, que exige um pátio central em todas as estruturas biofílicas.", "Ignora o requisito de que um edifício deve dedicar pelo menos 30% da sua área total à produção de alimentos agrícolas.", "Falta-lhe intenção e autenticidade, resultando em \"Greenwashing\" ao usar a natureza como uma ferramenta de marketing superficial em vez de um sistema profundamente integrado."], "a": 3}, {"q": "Contexto: Em climas tropicais com chuvas intensas e sol intenso, os arquitetos devem equilibrar a ventilação natural com a proteção contra condições meteorológicas extremas. A Escola Internacional Panyaden alcança este equilíbrio. Como é que a escolha específica de materiais e a forma estrutural desta escola cumprem os requisitos biofílicos de um ambiente tropical?", "opts": ["Usando uma chaminé solar central de 24 andares que puxa ativamente o ar húmido das salas subterrâneas através do efeito de chaminé.", "Confiando em almofadas de ETFE altamente refletoras e de alto albedo, estruturadas numa geometria Weaire-Phelan para bloquear completamente as chuvas de monção.", "Construindo uma enorme bateria térmica de terra compactada para absorver o calor diurno e libertá-lo durante a noite através de arrefecimento passivo por corrente descendente.", "Utilizando bambu local e um design elevado ao ar livre com formas orgânicas e biomórficas de telhado para maximizar a ventilação natural e proporcionar abrigo."], "a": 3}, {"q": "Contexto: Projetada por Abdel-Wahed El-Wakil, a Casa Heshmat no Egito utiliza arquitetura árabe tradicional para combater o calor severo do deserto. Sem depender do arrefecimento mecânico, que combinação biofílica de elementos estruturais cria especificamente um refúgio térmico nesta residência?", "opts": ["A utilização de estrutura em madeira laminada cruzada (CLT) para reduzir significativamente o carbono incorporado do edifício até 70%.", "A aplicação de vidro eletrocromático inteligente em todas as fachadas ocidentais para reter automaticamente o calor durante as noites frias do deserto.", "O uso de amplas fachadas de vidro viradas a leste combinadas com bombeamento geotérmico ativo para arrefecer as lajes interiores de betão.", "A integração de grossas paredes de terra locais para massa térmica, combinadas com pátios interiores e Malqaf (Torres de Vento) para ventilação natural."], "a": 3}, {"q": "Contexto: Yorkville - O Anel da PHA Architects na China pretende esbater as linhas entre o retalho comercial e os ambientes naturais. Que intervenção biofílica em grande escala está deliberadamente entrelaçada nos espaços circulatórios para transformar a experiência psicológica do consumidor?", "opts": ["Um jardim botânico interior central e extenso de 70.000 metros quadrados que proporciona exposição direta à natureza em vários níveis.", "Uma torre passiva de arrefecimento evaporativo de 24 andares que funciona como principal elemento visual central.", "O uso exclusivo de pedras de degrau (Roji) em vez de pavimentos convencionais para forçar os compradores a abrandar o ritmo.", "Uma fachada de algas hidropónicas totalmente exposta, que se estende por todo o edifício e que colhe biocombustível em frente às montras."], "a": 0}, {"q": "Contexto: O Oasia Hotel Downtown da WOHA, em Singapura, funciona como um \"lar para árvores e aves que também alberga humanos.\" Para além de simplesmente reduzir o smog urbano e regular a temperatura, qual é o objetivo explícito de design biofílico que este ecossistema vertical contendo mais de 20.000 plantas alcança?", "opts": ["Reduz a pegada de carbono global do edifício em exatamente 90% através do uso de painéis de micélio que sequestram carbono.", "Aumenta significativamente a biodiversidade local, promovendo uma Relação Evoluída entre Humanos e Natureza num núcleo urbano denso.", "Elimina completamente a dependência do hotel dos sistemas municipais de água ao captar e purificar 100% da água necessária.", "Cria um cenário contínuo de Risco Percebido ao permitir intencionalmente que a fauna selvagem tenha acesso livre aos corredores de visitantes."], "a": 1}, {"q": "Contexto: Uma empresa de engenharia está a desenvolver novos materiais para um pavilhão de alto desempenho. Querem um material para repelir naturalmente a poluição urbana e outro para fornecer resistência excecional com peso mínimo. Com base nos princípios da biomimética funcional, quais dois modelos naturais os engenheiros devem imitar para alcançar estas respetivas propriedades?", "opts": ["Ramificação dendriforme para superfícies auto-limpantes, e redes de raízes de micélio para elementos de tração ultra-fortes e leves.", "O efeito Folha de Lótus para superfícies autolimpantes, e estruturas de Seda de Aranha para elementos tensíveis ultra-fortes e leves.", "Ventilação do Termite Mound para superfícies autolimpantes, e a geometria Weaire-Phelan para elementos trónicos ultra-fortes e leves.", "O efeito Folha de Lótus para superfícies autolimpantes, e a Madeira Laminada Cruzada para elementos tensivos ultra-fortes e leves."], "a": 1}, {"q": "Contexto: Uma remodelação do átrio corporativo inclui uma grande piscina interior rasa adjacente a uma parede de vidro virada a sul. De acordo com os princípios funcionais das Características de Água no Design, qual é o principal benefício visual e perceptivo desta colocação específica?", "opts": ["A água atua como uma massa térmica, absorvendo calor durante todo o dia para compensar completamente a necessidade de aquecimento mecânico durante a noite.", "A superfície refletora amplifica a luz natural natural que entra e melhora a perceção espacial, tornando o átrio mais amplo.", "A água parada cultiva ativamente algas hidropónicas, mudando de cor ao longo do dia para indicar o consumo de energia do edifício.", "A piscina capta imediatamente 100% das águas cinzentas do edifício, tornando o ciclo natural de purificação visível para os funcionários."], "a": 1}, {"q": "Contexto: Construída em 1926, a Sala de Leitura da Biblioteca Suzzallo continua a ser um exemplo de excelência de design acústico e psicológico para o foco. Como é que as dimensões físicas e as escolhas materiais deste espaço histórico se sintetizam especificamente para criar uma \"Zona de Silêncio\" biofila?", "opts": ["Os tetos altos evocam maravilha, enquanto o extenso revestimento de madeira natural proporciona uma absorção sonora natural crucial para reduzir o eco.", "O uso rigoroso da geometria retangular e dos passadiços que se cruzam elimina completamente as distrações auditivas das salas adjacentes.", "A integração de elementos de água ocultos proporciona ruído branco constante que disfarça 100% de toda a conversa humana.", "O uso de defletores acústicos modernos à base de micélio escondidos na arquitetura histórica moderniza o seu amortecimento sonoro."], "a": 0}, {"q": "Contexto: O One Central Park de Jean Nouvel e Patrick Blanc está localizado numa zona barulhenta e movimentada de Sydney. Para além do seu impacto visual, como é que o enorme jardim vertical do edifício responde diretamente aos desafios acústicos do seu ambiente urbano?", "opts": ["As centrais emitem ondas acústicas de alta frequência que anulam ativamente o ronco de baixa frequência do trânsito próximo.", "A vegetação densa atua como elemento funcional da fachada, proporcionando uma absorção sonora crítica que mitiga a poluição acústica urbana.", "O jardim vertical serve como um enorme gerador de ruído branco ao canalizar ventos de alta velocidade através das suas estruturas ramificadas.", "As raízes das plantas são cultivadas através de painéis de micélio que isolam completamente as unidades residenciais interiores."], "a": 1}, {"q": "Contexto: Um arquiteto tem a tarefa de desenhar uma sala de jantar de restaurante que realce especificamente o ambiente noturno e a iluminação quente, sem luminárias artificiais durante a hora dourada. Qual a configuração espacial e arquitetónica que satisfaz de forma ótima este objetivo específico de iluminação biofílica?", "opts": ["A lançar SageGlass eletrocrómico que se tinge para um preto opaco precisamente 30 minutos antes do pôr do sol.", "Instalar claraboias enormes viradas a leste para captar o máximo de sol energizante e em ângulo elevado.", "Utilizando dispositivos de sombreamento dinâmico em exposições a sul para criar um jogo de sombras rigoroso ao meio-dia nas mesas.", "Utilizar exposições ocidentais e janelas de clerestório para captar e difundir tons quentes do pôr do sol."], "a": 3}, {"q": "Contexto: O Bullitt Center de Seattle foi concebido segundo o rigoroso padrão Living Building Challenge. Que interação mecânica/arquitetónica específica prova que a sustentabilidade energética extrema pode simultaneamente melhorar o bem-estar cognitivo neste edifício?", "opts": ["A dependência exclusiva de uma chaminé de ar condicionado central de 24 andares inspirada em térmitas, que elimina completamente a necessidade de janelas exteriores.", "A implementação de uma fachada de algas hidropónicas em circuito fechado que tinge as janelas de verde, gerindo o brilho enquanto a recolha de biocombustível.", "A integração total de sistemas mecânicos de AVAC alimentados por IA que selam completamente o edifício contra poluentes exteriores.", "O uso de janelas operáveis e monitores de luz, que regulam naturalmente a temperatura enquanto criam padrões de luz dinâmicos e difusos estimulantes."], "a": 3}, {"q": "Contexto: Um promotor está a considerar instalar uma enorme fachada habitacional hidropónica Green Fortune num novo arranha-céus comercial para responder às preocupações ambientais locais. Do ponto de vista macroecológico e de engenharia, que benefícios primários e mensuráveis este sistema Biowall proporcionará diretamente à área urbana envolvente?", "opts": ["Captura e purifica 100% da água negra do edifício, devolvendo-a instantaneamente à rede municipal como água potável.", "Substitui totalmente a necessidade de amortecimento acústico estrutural, bloqueando 90% de toda a poluição sonora exterior.", "Gera biocombustível suficiente através do cultivo de algas para alimentar todo o sistema de iluminação do edifício durante todo o ano.", "Filtra ativamente as partículas do ar urbano e reduz de forma mensurável o efeito de ilha de calor urbana localizada através da evapotranspiração."], "a": 3}, {"q": "Contexto: Uma unidade de cuidados de memória para pacientes com demência pretende integrar um jardim restaurador que vá além da estética visual para estimular ativamente a recordação de memórias. Que intervenção biofílica não visual específica é cientificamente reconhecida pela sua poderosa capacidade de estimular associações profundas de memória?", "opts": ["A instalação de caminhos de pedra altamente texturizados e não polidos para maximizar o risco tátil.", "A plantação estratégica de espécies aromáticas e perfumadas para estimular os sentidos olfativos.", "O uso de vidro eletrocromático dinâmico para alterar rapidamente padrões de luz e sombra.", "A integração de vórtices de água interiores completamente silenciosos e visualmente impressionantes."], "a": 1}, {"q": "Contexto: Após as lições aprendidas com as recentes pandemias globais, os urbanistas estão a rever as diretrizes para desenvolvimentos comerciais de alta densidade. Para reduzir de forma mensurável o risco de transmissão aérea de doenças, que métrica espacial específica é agora recomendada para inclusão em novas pegadas de edifícios biofílicos?", "opts": ["Aumentando a taxa de troca mecânica padrão de ar para alcançar um mínimo de ventilação de 15x por hora.", "Dedicar pelo menos 30% da área funcional total a ambientes exteriores e ao ar livre acessíveis.", "Garantindo que 90% de todos os corredores internos estão completamente desprovidos de superfícies táteis partilhadas.", "Exigindo o uso de jardins de inverno totalmente fechados e selados para todos os espaços públicos de reunião."], "a": 1}, {"q": "Contexto: Uma cidade costeira está a experienciar uma frequência crescente de marés de tempestade e aumento do nível do mar. O conselho municipal encomenda um plano diretor biofílico para proteger a linha costeira. Em vez de construir muros de betão mais altos, que estratégia biofílica adaptativa deveriam os planeadores implementar para gerir especificamente a resistência a inundações?", "opts": ["Instalação de quebra-mares em madeira laminada cruzada (CLT), que oferecem rigidez estrutural superior contra ondas de força de furacão.", "Desenvolver paisagens resilientes, de bordas suaves, e zonas húmidas costeiras integradas que absorvem e gerem naturalmente a subida das águas.", "Utilização de extensas redes de telhados verdes em todos os edifícios costeiros para eliminar completamente o acúmulo de águas pluviais ao nível da rua.", "Construir barreiras massivas e impermeáveis de terra batida para bloquear permanentemente as marés de entrar na grelha da cidade."], "a": 1}, {"q": "Contexto: Uma cidade densamente povoada do interior sofre de graves efeitos de Ilha de Calor Urbana (UHI), causando doenças relacionadas com o calor durante o verão. Para reduzir diretamente tanto o calor ambiente como as temperaturas localizadas da superfície, quais as três estratégias biofílicas integradas que a cidade deveria impor?", "opts": ["A transição completa para madeira laminada cruzada para todas as novas estruturas, juntamente com circuitos de arrefecimento geotérmico subterrâneos.", "A integração dos sistemas hidropónicos Biowall em todas as fachadas viradas a norte, o uso de alcatrão de baixo albedo e a restrição de parques exteriores.", "A expansão generalizada de Telhados Verdes, a expansão das Copas Arbóreas para evapotranspiração e o uso de Pavimentos Refletores de Alto Albedo.", "A construção de chaminés solares de 24 andares, o uso exclusivo da construção de Terra Batida e a remoção de todas as fontes de água ao nível da superfície."], "a": 2}, {"q": "Contexto: Uma empresa de arquitetura sustentável segue rigorosamente o cálculo do verdadeiro custo ambiental dos seus projetos biofílicos, reconhecendo que os materiais de baixo carbono são apenas uma parte da equação. Para garantir uma gestão ambiental absoluta desde a criação de um edifício até à sua demolição final, que quadro avaliativo abrangente deve a empresa utilizar?", "opts": ["Uma Avaliação completa do Ciclo de Vida (LCA) que acompanha o impacto ambiental de todos os materiais e processos desde a extração até ao fim da vida útil.", "Uma Auditoria de Atributos Biofílicos, garantindo que pelo menos 70 dos atributos de design de Stephen Kellert estão ativamente presentes na estrutura final.", "Uma simulação DIVA-para-Rhino que quantifica rigorosamente as poupanças operacionais de energia da luz natural ao longo de 50 anos.", "Um modelo de Previsão da Saúde das Plantas impulsionado por IA para garantir que a captura de carbono das fachadas vivas corresponde às emissões diárias do edifício."], "a": 0}, {"q": "Contexto: Um promotor de luxo de arranha-céus inclui uma enorme e exclusiva floresta no telhado e cascatas interiores fortemente guardadas, afirmando que o projeto é um triunfo do Design Biofílico. Do ponto de vista sociopolítico e ético, que grande crítica enfrenta este desenvolvimento específico dentro do quadro biofílico?", "opts": ["Isto constitui \"Greenwashing\" porque as plantas utilizadas não cultivam ativamente biocombustível nem colhem água da chuva.", "Não utiliza Materiais de Economia Circular, confiando antes em flora importada de alta qualidade em vez de plantas nativas regenerativas.", "Viola o princípio da Equidade, pois o design biofílico deve garantir o acesso a espaços naturais restaurativos para todos, não apenas para demografias privilegiadas.", "Ignora o requisito obrigatório de que um edifício biofílico dedique pelo menos 30% da sua área à agricultura pública."], "a": 2}, {"q": "Contexto: Ao apresentar uma proposta para uma ala hospitalar biofílica altamente cara, o arquiteto principal enfrenta ceticismo por parte do conselho financeiro quanto ao retorno garantido do investimento. Reconhecendo as críticas ao campo (por exemplo, Joye, 2007), que limitação válida deve o arquiteto admitir relativamente ao estado atual da ciência do design biofílico?", "opts": ["O design biofílico requer inerentemente 25% mais energia operacional para manter os sistemas vivos do que os sistemas mecânicos HVAC padrão.", "Não existe absolutamente nenhuma evidência empírica que ligue as vistas das janelas a tempos de recuperação mais rápidos dos pacientes em contextos clínicos.", "Os impactos a longo prazo, de várias décadas, de intervenções biofílicas específicas na saúde e produtividade humanas ainda não são totalmente compreendidos ou quantificados.", "O uso de materiais naturais como a madeira provou aumentar o stress dos pacientes devido ao receio de má higiene."], "a": 2}, {"q": "Contexto: Um distrito escolar quer construir uma escola primária Net-Zero, totalmente biofílica, com paredes de terra compactada, zonas húmidas integradas e vidro eletrocrómico. De acordo com análises da indústria (por exemplo, Heschong Mahone Group, 2003), qual é a principal barreira prática que frequentemente impede os projetos públicos de adotarem estes sistemas abrangentes?", "opts": ["Os custos iniciais significativamente elevados exigidos para materiais especializados, modelação avançada e infraestrutura verde integrada.", "As leis regulatórias rigorosas que proíbem explicitamente o uso de materiais naturais não tratados em instalações públicas de ensino.", "O facto de os edifícios biofílicos precisarem de até 6 vezes mais ventilação mecânica, aumentando drasticamente as taxas de manutenção a longo prazo.", "A comprovada diminuição de 20% no valor das propriedades associada a telhados verdes de alta manutenção e fachadas habitáveis."], "a": 0}, {"q": "Contexto: Uma equipa de arquitetura está a desenhar um centro de transporte complexo e quer garantir que as claraboias e elementos de água propostos reduzem realmente o stress dos passageiros antes de começarem as obras edifícios existentes dentro de enormes almofadas de ETFE climatizadas, utilizando geometria Weaire-Phelan.", "A implementação de Sistemas Verdes Modulares, que permitem adaptar edifícios existentes com componentes habitacionais adaptáveis e pré-fabricados.", "A conversão obrigatória de todas as caves históricas em geradores centralizados de biocombustíveis hidropónicos alimentados por IA.", "A substituição de todas as janelas de vidro padrão por vidro electrocrómico SageGlass para eliminar completamente a necessidade de sombreamento exterior."], "a": 1}, {"q": "Contexto: Um escritório de arquitetura progressista foi contratado para desenhar um pavilhão de exposições temporárias que será desmontado após dois anos. Para acompanhar as futuras tendências da sustentabilidade biofílica, que abordagem fundamental deve a empresa adotar relativamente aos materiais de construção do pavilhão?", "opts": ["Têm de construir toda a estrutura com betão recém-derramado e de baixo carbono para garantir que sobreviva à exposição de dois anos sem manutenção.", "Devem confiar estritamente na realidade virtual, sem construir qualquer estrutura física para alcançar uma pegada de carbono matematicamente perfeita e zero.", "Devem projetar utilizando os princípios da Economia Circular, garantindo que todos os componentes do edifício são explicitamente escolhidos para reutilização futura, regeneração ou biodegradação segura.", "Devem utilizar plásticos refletores 100% de alto albedo para minimizar a pegada térmica temporária, independentemente da reciclabilidade do material."], "a": 2}, {"q": "Contexto: Um estudante de pós-graduação em arquitetura procura um tema de tese que aborde uma necessidade crítica e não satisfeita na aplicação atual do Design Biofílico. Afastando-nos das sedes corporativas de alto orçamento, que área específica de investigação oferece o benefício social mais premente?", "opts": ["Análise das propriedades acústicas dos painéis de titânio puro para substituir a madeira
