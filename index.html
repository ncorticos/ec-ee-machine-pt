ra fornecer natureza direta (água e vegetação).", "Dependia exclusivamente do arrefecimento passivo evaporativo por corrente descendente de uma chaminé central inspirada por térmitas.", "Focava-se inteiramente em estímulos sensoriais não rítmicos, cultivando uma flora perfumada e bioluminescente do deserto."], "a": 1}, {"q": "Contexto: Um arquiteto paisagista deseja desenhar um oásis contemplativo e murado num clima quente e árido, inspirado nos Jardins Persas do século VI a.C. Que layout geométrico definidor e combinação sensorial deve o arquiteto implementar estritamente para replicar autenticamente a \"pairidaeza\"?", "opts": ["Uma forma biomórfica orgânica e extensa que evita completamente linhas retas e abraça caminhos sinuosos e obscuros (Mistério).", "Um átrio hidropónico completamente interior, fechado por uma chaminé solar de vidro de 24 andares.", "A tesselação Weaire-Phelan para espalhar a luz do meio-dia de forma uniforme sobre arbustos nativos do deserto.", "O Chahar Bagh (plano quádruplo) para organizar canais de água, árvores de sombra e elementos perfumados num refúgio geométrico rigoroso."], "a": 3}, {"q": "Contexto: Ao defender a necessidade do Design Biofílico perante um conselho corporativo, um arquiteto cita linhas temporais evolutivas humanas. De acordo com a premissa fundamental da biofilia, porque é que os humanos modernos estão a experienciar uma profunda desconexão sensorial?", "opts": ["Porque a revolução agrícola eliminou completamente a necessidade genética humana de perspetiva e refúgio.", "Porque os humanos passam aproximadamente 90% do seu tempo dentro de casa, enquanto as cidades existem apenas uma fração da história evolutiva humana.", "Porque a inteligência artificial substituiu completamente a necessidade psicológica de interações físicas com a natureza.", "Porque os códigos de construção modernos proíbem estritamente a integração de qualquer flora viva nos interiores comerciais."], "a": 1}, {"q": "Contexto: Uma equipa de design está a basear-se em simulações baseadas em IA durante a fase conceptual de um edifício de escritórios de planta profunda. Com base nas mais recentes tecnologias de design biofílico, como é que a Inteligência Artificial otimiza da forma mais eficaz a iluminação dinâmica do edifício?", "opts": ["Monitorizando os níveis biométricos de stress dos funcionários e tingindo automaticamente todas as janelas completamente negras.", "Deslocando dinamicamente as vigas estruturais de madeira laminada cruzada para acompanhar o sol.", "Alterando ativamente a constituição genética da bio-parede viva para emitir bioluminescência durante a noite.", "Executando simulações complexas de luz do dia para maximizar a penetração da luz natural e minimizar o encandeamento ao longo do dia."], "a": 3}, {"q": "Contexto: Com base no estudo inovador de Ulrich de 1984, as unidades de saúde modernas dão prioridade às vistas da natureza nas janelas. Para além de taxas de alta mais rápidas, que benefício fisiológico específico e mensurável tem sido consistentemente associado a doentes pós-operatórios com visão natural?", "opts": ["Uma redução significativa nas doses necessárias de medicação para a dor.", "Uma diminuição drástica do consumo total de energia por paciente do hospital.", "Eliminação completa da necessidade de ventilação mecânica artificial nas alas.", "Uma redução de 90% nas infeções transmitidas pelo ar adquiridas em hospitais."], "a": 0}, {"q": "Contexto: Está a ser oferecida uma bolsa de investigação universitária para estudos que expandam a ciência fundamental do design biofílico em contextos clínicos. Qual é o estudo proposto que se baseia mais diretamente no legado da investigação pioneira em psicologia ambiental de Roger Ulrich?", "opts": ["Análise da capacidade máxima de carga estrutural de defletores acústicos à base de micélio em enfermarias pediátricas.", "Investigação do impacto a longo prazo dos elementos biofílicos diretos no bem-estar psicológico e na recuperação do stress de pacientes de cuidados intensivos.", "Determinar o método mais rentável para adaptar hospitais históricos com telhados refletores de alto albedo.", "Cálculo do rendimento exato de biocombustível das fachadas de algas no exterior das clínicas de saúde urbanas."], "a": 1}, {"q": "Contexto: Uma empresa está a desenhar uma estância biofílica numa região montanhosa remota e culturalmente rica. Para garantir uma experiência biofílica resiliente e autêntica, porque é que os arquitetos têm de priorizar a \"Arquitetura Vernacular\" juntamente com os princípios biofílicos padrão?", "opts": ["Porque permite legalmente aos arquitetos contornar os códigos modernos de segurança estrutural relativos à madeira laminada cruzada.", "Porque os designs tradicionais dependem inteiramente do aquecimento e arrefecimento mecânicos ativos, fornecendo uma reserva para sistemas passivos.", "Porque a arquitetura vernacular exige estritamente o uso de vidro eletrocromático altamente avançado em todos os designs indígenas.", "Porque a utilização de madeira local, plantas nativas e design tradicional reflete a ecologia e a história cultural pré-existentes, prevenindo greenwashing superficial."], "a": 3}, {"q": "Contexto: Um urbanista enfrenta um défice orçamental, mas precisa de introduzir intervenções biofílicas numa rede envelhecida do centro da cidade, construída inteiramente em betão. De acordo com as tendências futuras da arquitetura biofílica, qual é a solução mais prática e escalável?", "opts": ["Demolição de 30% das estruturas de betão para satisfazer legalmente a necessidade agrícola biofílica.", "Envolvendo toda a grelha do centro da cidade numa enorme cúpula ETFE com controlo climático.", "Modernizar os edifícios existentes com Sistemas Verdes Modulares pré-fabricados e adaptáveis.", "Transferir toda a energia municipal inteiramente para biocombustíveis extraídos de novos arranha-céus à base de algas."], "a": 2}, {"q": "Contexto: Um designer biofílico está a selecionar materiais para um novo pavilhão, seguindo estritamente a tendência dos \"Materiais de Economia Circular\". Qual decisão reflete melhor a filosofia central desta tendência emergente de sustentabilidade?", "opts": ["A despejar uma fundação massiva e permanente de betão armado para garantir que o pavilhão nunca precise de ser movido.", "Utilizando plásticos sintéticos, não recicláveis, que imitam exatamente a textura visual do veio natural da madeira.", "Importando madeiras duras exóticas e altamente duráveis de outro continente para garantir que o pavilhão dure 100 anos.", "Especificar materiais explicitamente concebidos para biodegradação segura, regeneração ou reutilização completa no final do ciclo de vida do edifício."], "a": 3}, {"q": "Contexto: Um estudante que está a compilar uma tese sobre Conforto Ambiental Biofílico tem questões sobre a aplicação específica da IA em modelos de Previsão da Saúde das Plantas. Com base nos parâmetros finais dos materiais de aula carregados, quem deve o estudante contactar para esclarecimentos académicos adicionais?", "opts": ["giacomo.garziano@gg-loop.nl", "stephen.kellert@yale.edu", "biophilia@terrapinbrightgreen.com", "ncorticos@edu.ulisboa.pt"], "a": 3}, {"q": "Contexto: Uma crítica importante à arquitetura biofílica é que é frequentemente reservada para sedes corporativas de luxo ou apartamentos de luxo. Para democratizar os benefícios da biofilia para a saúde, para onde deve girar urgentemente a investigação académica e arquitetónica futura?", "opts": ["Para aumentar a complexidade estética das fachadas inteligentes multimilionárias.", "No sentido de desenvolver e validar estratégias de design biofílico de baixo custo e alto impacto, especificamente adaptadas a projetos de habitação acessível.", "Para modificar geneticamente as plantas de interior para que não exija absolutamente qualquer manutenção ou luz solar.", "Para desenvolver ferramentas de paisagismo totalmente autónomas e robóticas para extensas propriedades privadas."], "a": 1}, {"q": "Contexto: Os teóricos urbanos criticam frequentemente o impacto psicológico das paisagens urbanas contemporâneas e ricas em betão. Ao carecer de luz natural, ventilação e formas orgânicas, a que ambiente restritivo é frequentemente comparado a paisagem urbana moderna e sensorialmente privada?", "opts": ["Um jardim Mughal altamente complexo e transitório.", "Um recinto zoológico, à moda antiga, privado de sensibilidade.", "Um montículo de térmitas hipereficiente.", "Um dossel caótico e coberto de vegetação."], "a": 1}, {"q": "Contexto: A filosofia final da palestra biofílica desafia o papel do arquiteto moderno. Indo além de simplesmente desenhar estruturas esteticamente agradáveis, que responsabilidade ética última deve o arquiteto assumir?", "opts": ["Focando-se inteiramente na integração de inteligência artificial para eliminar gradualmente a necessidade de mão de obra humana na construção.", "Servir como gestor responsável do ambiente, moldando ativamente ecossistemas construídos sustentáveis e regenerativos.", "Atuando principalmente como otimizador financeiro para garantir os menores custos de construção possíveis.", "Servindo estritamente como engenheiro de ambientes sintéticos completamente isolados da natureza."], "a": 1}, {"q": "Contexto: Um design biofílico que enfatiza fortemente a \"Perspectiva\" e vistas de vidro amplas é altamente elogiado nos Estados Unidos, mas causa desconforto e stress quando replicado numa comunidade específica do Médio Oriente. Que lacuna crítica de investigação evidencia esta falha?", "opts": ["A suposição incorreta de que a madeira laminada cruzada proporciona um amortecimento acústico adequado em ambientes áridos.", "O facto de a hipótese da biofilia ser completamente geneticamente inválida para qualquer pessoa que viva fora da América do Norte.", "A absoluta superioridade do layout japonês Roji sobre todas as outras configurações espaciais.", "A necessidade urgente de estudar como as preferências biofílicas, as necessidades de privacidade e os análogos naturais diferem profundamente entre culturas distintas."], "a": 3}, {"q": "Contexto: Um campus biofílico foi concebido com sucesso para ser autossustentável, evoluindo naturalmente ao longo de décadas. Para além dos benefícios psicológicos humanos imediatos, quais são as duas métricas ecológicas que melhor medem o verdadeiro sucesso a longo prazo deste ambiente natural resiliente?", "opts": ["Receita corporativa total gerada e redução dos impostos municipais sobre a propriedade.", "O volume exato de biocombustível colhido e a velocidade de evaporação da água da chuva.", "O aumento quantificável da diversidade biológica local e o crescimento geral da biomassa viva.", "A rigidez estrutural das colunas dendriformes e a absorção acústica das paredes do micélio."], "a": 2}, {"q": "Contexto: O complexo de apartamentos Freebooter está localizado na Zeeburgereiland, em Amesterdão. Como é que a história específica deste local impulsionou fundamentalmente o conceito biofílico do design \"Freebooter\"?", "opts": ["Originalmente era uma floresta densa e antiga, o que levou os arquitetos a imitar as copas ramificadas das árvores usando madeira laminada cruzada.", "Era uma antiga mina industrial de carvão, o que levou a um projeto inteiramente focado no arrefecimento geotérmico subterrâneo e purificação do ar.", "Foi o local de um jardim mogol do século XVII, que os arquitetos replicaram usando canais de água rigorosamente retangulares.", "Historicamente, foi um local de preparação subaquática para a Marinha Holandesa, inspirando os arquitetos a desenhar o complexo como um moderno \"navio em terra\"."], "a": 3}, {"q": "Contexto: O exterior do Freebooter apresenta uma fachada de cedro com persianas altamente distinta. Com base nos princípios de controlo ambiental biofílico, como foram determinadas a forma e o ângulo precisos destas persianas de madeira?", "opts": ["Eram escalonados aleatoriamente para criar estímulos sensoriais não rítmicos e imitar o caos visual de uma copa da selva.", "Foram concebidas para abrir e fechar dinamicamente usando dobradiças mecânicas acionadas por IA que respondem à velocidade do vento em tempo real.", "Foram posicionados parametricamente com base numa análise ao longo do ano do movimento do sol para otimizar a penetração da luz natural mantendo a privacidade.", "Foram concebidos estritamente para funcionar como deflectores acústicos, captando e desviando o ruído de alta frequência do trânsito rodoviário próximo."], "a": 2}, {"q": "Contexto: Os arquitetos do Freebooter, Studio GG-loop, optaram por utilizar uma estrutura híbrida de Madeira Laminada Cruzada (CLT) e aço. Para além da imensa redução do carbono incorporado, que enorme vantagem logística proporcionou esta abordagem pré-fabricada?", "opts": ["Permitiu que a estrutura principal do edifício de quatro andares fosse erguida no local num prazo excecionalmente rápido de apenas três semanas.", "Garantia que a fachada de cedro seria totalmente autolimpável e imune à podridão durante exatamente 100 anos.", "Permitiu ao edifício obter instantaneamente uma certificação de energia líquida zero antes mesmo dos ocupantes de se mudarem.", "Significava que toda a estrutura podia ser legalmente classificada como um pavilhão temporário, contornando as rigorosas leis de zoneamento de Amesterdão."], "a": 0}, {"q": "Contexto: Dentro dos duplex Freebooter, o arquiteto evitou propositadamente divisões padrão em formato de caixa. Imitando a disposição da cabine de um navio, como é que a planta interior impacta diretamente a experiência biofílica do habitante?", "opts": ["O interior depende estritamente de simetria exata e retilínea, forçando os habitantes a um padrão de circulação rígido e altamente previsível.", "A disposição obriga os ocupantes a navegar por uma série de pavimentos de vidro de alto risco suspensos diretamente sobre uma cascata central interior.", "Os espaços são divididos por enormes paredes de micélio insonorizadas que criam zonas completamente isoladas e estéreis de silêncio em todas as divisões.", "Os espaços são altamente fluidos e orgânicos, com curvas contínuas que se desdobram e escadas em forma de escada que incentivam a exploração e o movimento."], "a": 3}, {"q": "Contexto: Para ligar autenticamente os apartamentos Freebooter à história marítima de Amesterdão, a GG-loop restringiu fortemente a sua paleta material. Que combinação específica de materiais foi escolhida para refletir explicitamente esta herança da construção naval, ao mesmo tempo que apoiava a ligação biofílica à natureza?", "opts": ["Cedro gigante, madeira de pinho, aço e vidro extenso (vidro).", "Blocos de micélio biodegradáveis, bambu e folhas de palmeira trançadas.", "Plásticos biomiméticos de folha de lótus, painéis de algas hidropónicas e titânio puro.", "Sálvia eletrocrómica, terra batida e almofadas de ETFE altamente refletoras."], "a": 0}, {"q": "Contexto: O design urbano biofílico moderno frequentemente tem dificuldades em equilibrar grandes extensões de vidro (para luz natural/vistas) com a necessidade humana de Refúgio (privacidade). Como é que o design específico de fachadas duplas do Freebooter resolve este conflito inerente?", "opts": ["Utilizando vidros inteligentes de IA que se tornam instantaneamente opacos sempre que um peão se aproxima da linha da propriedade.", "Envolvendo o vidro interior do chão ao teto com as persianas de cedro meticulosamente inclinadas, protegendo as linhas de visão da rua enquanto deixa a luz entrar.", "Eliminando completamente as janelas do rés-do-chão e confiando apenas em claraboias enormes para iluminação interior.", "Plantando um enorme e impenetrável muro biopónico hidropónico sobre todo o vidro virado para a rua para bloquear completamente o acesso visual."], "a": 1}, {"q": "Contexto: O Studio GG-loop nomeou deliberadamente o projeto \"Freebooter.\" Para além de simplesmente significar \"pirata\", que filosofia conceptual de design representa este termo histórico holandês para os arquitetos?", "opts": ["Uma celebração da arquitetura marítima combinada com o espírito aventureiro e pioneiro dos marinheiros históricos a explorar os mares.", "O ato de capturar e filtrar ilegalmente o abastecimento municipal de água da cidade para uso privado.", "O processo biológico específico em que uma fachada viva domina e consome agressivamente a sua estrutura hospedeira.", "Uma rejeição de todos os códigos modernos de construção em favor de técnicas de construção orgânicas e totalmente não regulamentadas."], "a": 0}, {"q": "Contexto: Um elemento-chave do design biofílico é esbater as fronteiras entre o ambiente construído e o mundo natural. No duplex superior do Freebooter, como é que esta continuidade é conseguida física e visualmente?", "opts": ["Através de um sistema de varandas cuidadosamente integradas, terraços e um corredor curvo que conduz para fora, protegido pelos topos das persianas de cedro.", "Utilizando um telhado biomórfico maciço e retrátil que expõe totalmente o piso superior ao céu aberto.", "Bombeando água do próximo rio IJ diretamente através da sala de estar através de canais abertos e interiores.", "Cobrindo 100% dos pisos interiores com solo real e gramíneas holandesas nativas."], "a": 0}, {"q": "Contexto: As plantas dos apartamentos Freebooter são extremamente intencionais em relação aos ritmos humanos diários. Como estão as funções \"vitais\" da casa (cozinha e casas de banho) organizadas espacialmente em relação às áreas de estar e descanso?", "opts": ["São empurrados exclusivamente para as extremidades exteriores do edifício, atuando como um amortecedor acústico contra o ruído da rua.", "Estão totalmente separados num pátio exterior, obrigando os ocupantes a sair para lhes aceder.", "Estão suspensos do teto em cápsulas leves e pré-fabricadas para maximizar a área do chão abaixo.", "Estão agrupados de forma aperta num \"núcleo principal\" central, em torno do qual os espaços orgânicos e abertos de habitação e descanso evoluem de forma fluida."], "a": 3}, {"q": "Contexto: The Freebooter representa um marco na arquitetura biofílica holandesa contemporânea. Que arquiteto e estúdio de design são responsáveis pela conceção e execução deste \"Navio em terra\"?", "opts": ["Stefano Boeri e BIG (Grupo Bjarke Ingels)", "Renzo Piano e o Grupo Heschong Mahone", "Mick Pearce e Foster + Parceiros", "Giacomo Garziano e Studio GG-loop"], "a": 3}], "exam": [{"q": "Segundo a aula, como variou a área terrestre de Tuvalu entre 1971 e 2014?", "opts": ["Diminuiu cerca de 15 %", "Aumentou cerca de 2,9 % (73,5 ha)", "Diminuiu cerca de 2,9 %", "Manteve-se exatamente igual"], "a": 1, "t": 1}, {"q": "Que lição tira a aula do caso de Tuvalu sobre o nível do mar e as costas?", "opts": ["Uma costa pode crescer enquanto o mar sobe", "A área terrestre e o nível do mar variam sempre em conjunto", "As ilhas encolhem sempre quando o mar sobe", "A subida do mar para onde há recifes"], "a": 0, "t": 1}, {"q": "Que definição de desenvolvimento sustentável ancora o vocabulário do curso?", "opts": ["Construir apenas com materiais locais", "Usar apenas energia renovável em todos os edifícios", "Manter as emissões nacionais abaixo do nível de 1990", "Satisfazer as necessidades do presente sem comprometer a capacidade das gerações futuras de satisfazerem as suas"], "a": 3, "t": 1}, {"q": "O que assinala o Dia da Sobrecarga da Terra?", "opts": ["O último dia da estação de aquecimento", "A data em que a procura anual de recursos ecológicos excede o que o planeta regenera nesse ano", "A data em que a temperatura global ultrapassa 1,5 °C", "O dia do ano com a maior concentração de CO₂"], "a": 1, "t": 1}, {"q": "Portugal atingiu o seu dia de sobrecarga a 7 de maio de 2026. A quantas Terras corresponde, aproximadamente?", "opts": ["Cerca de 1,0", "Cerca de 1,73", "Cerca de 5", "Cerca de 2,9"], "a": 3, "t": 1}, {"q": "Que fator climático corresponde à velocidade e à dimensão do aquecimento recente?", "opts": ["A atividade solar", "Os ciclos orbitais (de Milankovitch)", "Os aerossóis vulcânicos", "Os gases com efeito de estufa"], "a": 3, "t": 1}, {"q": "Em que escala de tempo atuam os ciclos orbitais de Milankovitch?", "opts": ["Dezenas de milhares de anos", "Alguns anos", "Meses", "Décadas"], "a": 0, "t": 1}, {"q": "Qual o efeito típico de uma grande erupção vulcânica na temperatura à superfície?", "opts": ["Nenhum efeito", "Aquecimento permanente", "Aquecimento durante séculos", "Arrefecimento durante alguns anos"], "a": 3, "t": 1}, {"q": "Sem gases com efeito de estufa a superfície da Terra estaria perto de −18 °C; com eles a média é cerca de 15 °C. Qual é a dimensão do efeito de estufa?", "opts": ["Cerca de 33 °C", "Cerca de 3 °C", "Cerca de 15 °C", "Cerca de 18 °C"], "a": 0, "t": 1}, {"q": "Que gás é a referência (GWP100 = 1) do potencial de aquecimento global?", "opts": ["N₂O", "CH₄", "CO₂", "Árgon"], "a": 2, "t": 1}, {"q": "O metano (CH₄) tem um tempo de vida curto, cerca de 12 anos. Qual é o seu GWP100 na aula?", "opts": ["Milhares", "273", "Cerca de 27 a 30", "1"], "a": 2, "t": 1}, {"q": "Porque é que um gás vestigial pode pesar mais do que a sua parte no ar?", "opts": ["É produzido apenas por vulcões", "É mais pesado do que o azoto", "Reflete a luz do sol", "Tem um potencial de aquecimento global elevado e um tempo de vida longo"], "a": 3, "t": 1}, {"q": "No ciclo do carbono, o que faz a madeira de longa duração num edifício?", "opts": ["Liberta o carbono de uma só vez", "Não tem papel no ciclo do carbono", "Mantém o carbono armazenado enquanto dura", "Retira carbono do oceano"], "a": 2, "t": 1}, {"q": "O que decide se o carbono armazenado num material de construção regressa ao ar?", "opts": ["A sua condutibilidade térmica", "A sua cor", "A altura do edifício", "O seu fim de vida"], "a": 3, "t": 1}, {"q": "Porque é que a aula insiste nas emissões acumuladas e não nas anuais?", "opts": ["O clima responde ao stock acumulado ao longo do tempo, não ao fluxo de um ano", "As emissões acumuladas são sempre menores", "As emissões anuais não são medidas", "Só contam as emissões depois de 2000"], "a": 0, "t": 1}, {"q": "Qual era a concentração de CO₂ pré-industrial, face a cerca de 428,73 ppm em maio de 2026?", "opts": ["Cerca de 380 ppm", "Cerca de 350 ppm", "Cerca de 280 ppm", "Cerca de 180 ppm"], "a": 2, "t": 1}, {"q": "O que mostram os núcleos de gelo sobre o CO₂ nos últimos 800 000 anos?", "opts": ["Foi mais alto do que hoje em todas as glaciações", "Nunca esteve acima de cerca de 300 ppm", "Foi constante, em 280 ppm", "Esteve muitas vezes acima de 500 ppm"], "a": 1, "t": 1}, {"q": "Com as médias de Mauna Loa de 2004 e 2023, qual é a tendência média do CO₂ no exemplo da aula?", "opts": ["Cerca de 2,28 ppm por ano", "Cerca de 10 ppm por ano", "Cerca de 0,5 ppm por ano", "Cerca de 5 ppm por ano"], "a": 0, "t": 1}, {"q": "Quanto esteve 2025 acima da média de 1850–1900, segundo a OMM?", "opts": ["0,44 °C", "4,5 °C", "2,5 °C", "1,44 °C (± 0,13 °C)"], "a": 3, "t": 1}, {"q": "Porque é que as cidades devem ser projetadas para a curva de temperatura terrestre e não para a do oceano?", "opts": ["Os dados terrestres são mais precisos", "As cidades estão em terra, e a terra aquece mais depressa do que o mar", "O mar aquece mais depressa do que a terra", "O oceano não aquece"], "a": 1, "t": 1}, {"q": "Porque é que a perda de gelo marinho no Ártico aquece ainda mais a superfície?", "opts": ["O gelo a derreter aquece diretamente o ar", "Menos superfície branca reflete menos energia (retroação do albedo)", "A água do mar reflete mais luz do que o gelo", "O gelo liberta CO₂ ao derreter"], "a": 1, "t": 1}, {"q": "Quanto vapor de água a mais retém o ar por cada grau de aquecimento, aproximadamente?", "opts": ["Cerca de 6 a 7 %", "Cerca de 1 %", "Cerca de 20 %", "Cerca de 50 %"], "a": 0, "t": 1}, {"q": "Quais são as três linhas de evidência independentes das alterações climáticas na aula?", "opts": ["Indicadores indiretos (proxies), instrumentos e modelos", "Previsões, notícias e proxies", "Apenas satélites", "Opiniões, sondagens e modelos"], "a": 0, "t": 1}, {"q": "Como mostram as estações rurais e as boias oceânicas que o aquecimento não é um efeito das cidades?", "opts": ["Medem apenas a precipitação", "Não mostram aquecimento", "Mostram o mesmo aquecimento longe das cidades", "Estão instaladas apenas em cidades"], "a": 2, "t": 1}, {"q": "Qual a diferença entre uma previsão meteorológica e uma projeção climática?", "opts": ["A previsão é um local e uma hora, com fiabilidade de cerca de 8 a 10 dias; a projeção é a estatística de décadas para uma região", "A previsão cobre décadas e a projeção apenas dias", "São a mesma coisa", "A projeção é mais precisa para amanhã"], "a": 0, "t": 1}, {"q": "Para Portugal continental em 2071–2100, que variação da temperatura média anual projeta o RNA2100 no cenário RCP8.5?", "opts": ["Cerca de +4,5 °C", "Cerca de +0,5 °C", "Cerca de +1,5 °C", "Cerca de −2 °C"], "a": 0, "t": 1}, {"q": "O que mostram os modelos climáticos quando correm só com forçamento natural?", "opts": ["Um forte arrefecimento de vários graus", "O mesmo aquecimento observado", "Um aquecimento próximo de zero", "Mais aquecimento do que o observado"], "a": 2, "t": 1}, {"q": "Que inversão mostraram os incêndios do Ártico em 2019?", "opts": ["Os incêndios absorveram CO₂", "Solo que armazenava carbono tornou-se uma fonte", "Os incêndios travaram a perda de gelo marinho", "O Ártico começou a arrefecer"], "a": 1, "t": 1}, {"q": "Que ideia deixa aos arquitetos o incêndio de Palisades em 2025?", "opts": ["A escolha dos materiais é uma decisão de sobrevivência", "Os incêndios não chegam a zonas urbanas densas", "Só as florestas ardem", "Os regulamentos tornam o fogo irrelevante"], "a": 0, "t": 1}, {"q": "Porque é que a resposta de projeto ao clima é regional na Europa?", "opts": ["Toda a Europa enfrenta o mesmo risco", "Os regulamentos são iguais em todo o lado", "Só o norte da Europa é afetado", "Cada região enfrenta risc V2", "I2-V3"], "a": 2}, {"q": "In zone I3-V1, with degree-days between about 3 000 and 2 120, which strategy is described as highly suitable?", "opts": ["Evaporative cooling with water mirrors", "Permanent cross-ventilation, without inertia", "Passive solar heating systems with strong storage mass", "Lightweight construction and raised floors"], "a": 2}, {"q": "Zone I1-V1, from about 1 500 degree-days in Caldas da Rainha to 940 in Portimão, is characterized by:", "opts": ["Depending on strong thermal inertia and water", "Being defined by altitude", "Being the most demanding in winter", "Being the mildest on the mainland, with ventilation instead of evaporative cooling"], "a": 3}, {"q": "What features define the traditional house of the North (Minho, Trás-os-Montes and the Beiras)?", "opts": ["Volcanic basalt walls and projecting eaves", "Light structure with deep verandas and a raised floor", "Low volumes, whitewash and flat roofs", "Pitched roofs, granite and schist, small openings and external stairs"], "a": 3}, {"q": "What features define the traditional house of the Centre and South (Alentejo and Algarve)?", "opts": ["Low volumes, thick walls, whitewash and flat or shallow roofs", "Light construction on stilts, without thermal mass", "Large unshaded south-facing glazing", "Very steep schist roofs and external stairs"], "a": 0}, {"q": "Which element is characteristic of the vernacular architecture of the islands (Azores and Madeira)?", "opts": ["Inner courtyards with water mirrors", "Whitewashed rammed-earth walls without a roof", "Monumental chimneys above the ridge", "Volcanic basalt walls, projecting eaves and the thatched A-frame Santana house"], "a": 3}, {"q": "In the lecture's reading, the whitewash of an Alentejo wall should be understood mainly as:", "opts": ["An evaporative cooling system", "A reflectance decision, reversible and renewed every year", "A substitute for the wall's thermal insulation", "A decorative choice with no thermal effect"], "a": 1}, ", "opts": ["With a sealed roof and thick insulation", "With shaded enclosing surfaces, evaporation from the pool and planting, and a stack that discharges heat after sunset", "With a south-facing glazed wall that collects heat", "With an underground earth tube under the floor"], "a": 1}, {"q": "Who gave the subject its name, \"bioclimatic\", in the 1963 book Design with Climate?", "opts": ["Baruch Givoni", "Otto Koenigsberger", "Victor Olgyay", "Steven Szokolay"], "a": 2}, {"q": "What is Olgyay's central argument?", "opts": ["Climate generates form, and that generation is specific to a latitude", "Good insulation makes building form irrelevant", "One optimal building type works in every climate", "Comfort can only be guaranteed by mechanical systems"], "a": 0}, {"q": "At Mesa Verde (Colorado), what did most of the climatic work?", "opts": ["Thick insulated walls built on open ground", "Large glazed openings facing west", "Mechanical ventilation through the rock", "The site: a canyon shelf whose overhang shades the summer sun and admits the winter sun"], "a": 3}, {"q": "Which statement matches the working definition of bioclimatic design used in this lecture?", "opts": ["Any design that includes renewable energy systems", "The use of form, orientation, mass and opening to reach comfort with the energy the site already supplies", "Design that meets a regulatory energy certificate class", "Design that uses only natural and local materials"], "a": 1}, {"q": "How does passive solar architecture relate to bioclimatic design?", "opts": ["It is a narrower subset concerned with collecting, storing and distributing solar gain without a machine", "It is a much wider concept that includes water, waste and biodiversity", "It is a regulatory performance target", "It is exactly the same thing under another name"], "a": 0}, {"q": "What is NZEB (nearly zero-energy building)?", "opts": ["A design method for shaping a building's form", "A vernacular construction technique", "A regulatory and performance target that says what a building must achieve, not what shape achieves it", "A type of heat-recovery ventilation unit"], "a": 2}, {"q": "How does bioclimatic design relate to sustainable architecture?", "opts": ["They are synonyms", "Sustainable architecture is a narrower part of bioclimatic design", "They have nothing in common", "Bioclimatic design is one instrument inside the much wider field of sustainable architecture"], "a": 3}, {"q": "Modernists such as Le Corbusier recognised climate (for example, the brise-soleil at Chandigarh). What happened in the following decades?", "opts": ["Sealed glass and mechanical plant spread to every continent, including the tropics", "Every country adopted solar access laws", "Vernacular building became the global standard", "Air conditioning was banned in hot climates"], "a": 0}, {"q": "According to Gropius, how does true regional character arise?", "opts": ["By copying historic local styles", "From the basic differences that climate imposes on design", "From the use of imported materials", "From national building codes"], "a": 1}, {"q": "Why was bioclimatic design largely abandoned between 1950 and 1973?", "opts": ["Building codes prohibited it", "Architects lacked climate data", "Cheap oil and air conditioning turned a design problem into an equipment problem", "Vernacular materials became unavailable"], "a": 2}, {"q": "Which event reopened interest in climate-responsive design?", "opts": ["The invention of double glazing", "The oil shocks of 1973", "The end of the Second World War", "The Kyoto Protocol of 1997"], "a": 1}, {"q": "What does the recast EU Energy Performance of Buildings Directive (EPBD) introduce?", "opts": ["A ban on timber construction", "A requirement to use only vernacular forms", "A fixed date for zero-emission buildings", "The abolition of energy certificates"], "a": 2}, {"q": "In a tropical humid climate, how should thermal mass be treated?", "opts": ["As a liability, because there  south overhang work well in a Mediterranean climate?", "opts": ["Because it rains all summer", "Because the sun is always at the same height", "Because there is no winter", "Because the summer sun is high and the winter sun is low, so the two seasons are geometrically separable"], "a": 3}, {"q": "In a mountain climate, which three moves do almost all the work?", "opts": ["Compactness, mass and orientation", "Large windows, light construction and raised floors", "Evaporation, courtyards and wind catchers", "Open plans, verandas and permeable walls"], "a": 0}, {"q": "In the traditional northern European farmhouse, what does \"the plan is the insulation\" mean?", "opts": ["The walls are filled with straw", "Every unheated volume (granary, byre) sits where the heat losses are, around the heated rooms", "The house is built underground", "All rooms are heated equally"], "a": 1}, {"q": "In a maritime climate, what is the main design problem?", "opts": ["Storing heat in heavy walls", "Extreme daily temperature swing", "Keeping water out of the fabric and air moving through the plan", "Excluding intense solar radiation"], "a": 2}, {"q": "In an arctic climate, why are entrances designed as airlocks?", "opts": ["To let snow in for insulation", "To increase ventilation", "To cool the building in summer", "Because there is permanent heat loss and no cooling problem at all"], "a": 3}, {"q": "Why is the polar case described as \"the envelope is the whole building\"?", "opts": ["There is no useful sun, ground or night to use, so everything is done through the skin", "Because polar buildings have no roof", "Because buildings there are made only of glass", "Because natural ventilation is the main strategy"], "a": 0}, {"q": "When drawing the obstruction profile (horizon) for a site in the northern hemisphere, which month is the governing case?", "opts": ["June", "March", "December", "September"], "a": 2}, {"q": "How do internal heat gains from people, equipment and sun behave across ventilation require?", "opts": ["Openings on opposite sides and a plan that does not block the route", "A single small window", "A mechanical fan", "A sealed envelope"], "a": 0}, {"q": "What drives stack ventilation?", "opts": ["Wind pressure on one façade only", "Evaporation of water", "Solar radiation on glass", "Temperature difference: warm air rises and leaves high while cooler air enters low"], "a": 3}, {"q": "Which of these acts as a ventilation stack, whether or not it was designed as one?", "opts": ["A carpet", "A stairwell, chimney or courtyard", "A double-glazed window", "A basement wall"], "a": 1}, {"q": "What is night flushing?", "opts": ["Cleaning ventilation ducts at night", "Heating the building at night", "Opening at night and closing by day, so cool night air removes the heat the mass absorbed", "Running air conditioning only at night"], "a": 2}, {"q": "What condition must be met for evaporative cooling to work?", "opts": ["The air must be dry enough to accept the vapour", "The air must be very humid", "The building must be lightweight", "The site must be at sea level"], "a": 0}, {"q": "Why are the Alhambra's water channels and the Persian wind tower over a cistern all found in dry climates?", "opts": ["Because water is cheaper there", "Because evaporative cooling only works where the air is dry, and does almost nothing on a humid coast", "Because they were decorative traditions", "Because humid climates have no water"], "a": 1}, {"q": "Which set of intentions belongs to a hot and dry climate?", "opts": ["Shade, open, ventilate, never store", "Capture, store, conserve, buffer", "Exclude, store, evaporate, delay", "Open, lift, permeate, reflect"], "a": 2}, {"q": "Which set of intentions belongs to a hot and humid climate?", "opts": ["Exclude, store, evaporate, delay", "Capture, store, conserve, buffer", "Compact, seal, insulate, heat", "Shade, open, ventilate, never store"], "a": 3}, {"q": "Which set of intentions belongs to a cold climate?", "opts": ["Capture, store, conserve, buffer", "Shade, open, ventilate, never store", "Exclude, store, evaporate, delay", "Lift, open, reflect, ventilate"], "a": 0}, {"q": "In a hot-dry urban fabric, why are streets kept narrow?", "opts": ["To save land for agriculture", "So that buildings shade each other", "To increase wind speed for cooling", "To reduce construction costs"], "a": 1}, {"q": "In a hot-dry climate, what does a long thermal lag in the walls achieve?", "opts": ["It stops all heat from entering", "It cools the air through evaporation", "The heat peak arrives inside after the occupants have left the room", "It increases daytime solar gains"], "a": 2}, {"q": "In a hot-humid climate, where is insulation placed?", "opts": ["On the roof only, where the radiant load is", "In all walls and floors", "Nowhere at all", "Only under the ground floor slab"], "a": 0}, {"q": "Why is evaporative cooling ineffective in hot-humid climates?", "opts": ["Because there is no water available", "Because the temperature is too low", "Because buildings are raised on stilts", "Because the wet-bulb depression is too small"], "a": 3}, {"q": "What does a hot-humid plan look like?", "opts": ["Compact, deep, with small openings", "Maximum envelope, minimum depth, raised floor, deep overhangs, every room on two façades", "Buried in the ground with a central courtyard", "A sealed glass box"], "a": 1}, {"q": "In a cold climate, where should insulation be placed relative to the mass?", "opts": ["Inside the mass, facing the room", "Only in the roof", "Outside the mass", "Insulation is not needed if the walls are heavy"], "a": 2}, {"q": "In a cold-climate plan, how should the entrance be designed?", "opts": ["It should never open directly into a heated room", "It should open straight into the living room", "It should face north without a vestibule", "It should be fully glazed"], "a": 0}, {"q": "For solar collection in a cold climate, what kind of shading is recommended on the south?", "opts": ["Fixed geometry that blocks the sun all year", "No shading at all, ever", "Dark-tinted glass", "Shading that can be removed in winter"], "a": 3}, {"q": "When does heat recovery ventilation become worth having in a cold climate?", "opts": ["Before insulating the walls", "Once the fabric (insulation and airtightness) is good enough", "Only in single-glazed buildings", "Never, because it wastes energy"], "a": 1}, {"q": "Which architect, 2022 Pritzker Prize laureate, cools classrooms in Burkina Faso with local clay and without air conditioning?", "opts": ["Glenn Murcutt", "Balkrishna Doshi", "Diébédo Francis Kéré", "Wang Shu"], "a": 2}, {"q": "At the Lycée Schorge (Kéré, 2016), what removes heat without a plant room?", "opts": ["A double roof with a ventilated cavity above a perforated ceiling", "A central air-conditioning unit", "A fully glazed façade", "An underground ice store"], "a": 0}, {"q": "Glenn Murcutt's Marika-Alderton House translates the logic of the tent into permanent construction. Which features does it use?", "opts": ["Heavy masonry, small windows and a central stove", "A sealed envelope with mechanical ventilation", "A buried plan with a courtyard", "Operable walls, a raised floor, no glass and a deep roof"], "a": 3}, {"q": "Glenn Murcutt's notes for the Boyd Education Centre at Riversdale are an example of a climate brief. What do they record?", "opts": ["Only the client's room schedule", "Altitude, climate type, rainfall, protection from cold winds, seasonal temperatures and soil", "Only the construction budget", "Only the planning regulations"], "a": 1}, {"q": "Which strategies does the Split Bathhouse (Croatia) combine on a Mediterranean coast?", "opts": ["Snow storage and steep roofs", "Raised floors and no thermal mass", "Mass, water and cross-ventilation", "Sealed glazing and mechanical cooling"], "a": 2}, {"q": "Why is lime wash on a wall described as a \"reflectance decision\" and not decoration?", "opts": ["It controls surface albedo and is reversible, renewed every year with a brush", "It makes the wall waterproof permanently", "It increases the wall's thermal mass", "It is required by law"], "a": 0}, {"q": "Why is deciduous tree canopy a special shading device?", "opts": ["It blocks winter sun completely", "It is specified in the joinery schedule", "It needs no maintenance", "It is the only shading device that changes with the season on its own"], "a": 3}, {"q": "A pond next to a building is an asset in a dry inland climate. What is it on a humid coast?", "opts": ["A source of heating", "A humidity liability", "A replacement for insulation", "Exactly the same asset"], "a": 1}, {"q": "In what order are the design decisions in this lecture arranged?", "opts": ["By how interesting they are", "Alphabetically", "By how hard they are to undo", "By their cost"], "a": 2}], "aula4": [{"q": "Which site condition can remove natural ventilation from the brief before design starts?", "opts": ["A site with no reusable structures", "A site too noisy to open a window", "A site with a gentle slope to the north", "A site far from renewable energy suppliers"], "a": 1}, {"q": "What does the urban heat island describe?", "opts": ["Rural air being warmer than city air at night", "Suburbs being colder than both city and countryside", "City air being warmer than the rural land at its edge", "Coastal cities being warmer than inland cities"], "a": 2}, {"q": "For a pedestrian in a street, which of these acts as a heat sink rather than a heat source?", "opts": ["Long-wave radiation from walls and road", "Diffuse solar radiation", "Heat from traffic", "Evaporation from trees and water"], "a": 3}, {"q": "On a hillside, which plot is the ideal place to build?", "opts": ["Sheltered from wind, dry and sunny", "Exposed to wind, dry and sunny", "Exposed to wind, humid and shaded", "Sheltered from wind, humid and shaded"], "a": 0}, {"q": "In winter, what can a slope or ridge located to the south of a plot do?", "opts": ["Channel warm winds  compared by relative compactness. Which statement is correct?", "opts": ["A higher relative compactness means higher heat losses", "Relative compactness does not affect heat losses", "Only roof shape affects heat losses", "A lower relative compactness means higher heat losses"], "a": 3}, {"q": "How does the optimum orientation sector for solar gain behave across Europe?", "opts": ["It is identical at every latitude", "It only depends on the building's use", "It changes with latitude", "It always points due west"], "a": 2}, {"q": "In the Northern Hemisphere, which basic orientation is recommended for a passive building?", "opts": ["Long axis north-south, glass to the east", "Long axis east-west, main glazing to the south", "Long axis east-west, main glazing to the north", "Long axis north-south, glass to the west"], "a": 1}, {"q": "Why is a large west-facing façade problematic in summer?", "opts": ["It receives no radiation at all", "It faces a low afternoon sun that no overhang can stop", "It faces the high midday sun", "It is always exposed to cold winds"], "a": 1}, {"q": "Which summary of seasonal priorities for orientation is correct?", "opts": ["Winter: steer to the wind; summer: orient to the sun", "Both seasons: orient to the wind only", "Winter: orient to the sun; summer: steer to the wind", "Both seasons: avoid the sun completely"], "a": 2}, {"q": "According to Olgyay, what is the approximate optimum plan ratio for a temperate climate?", "opts": ["1 : 1.1", "1 : 1.3", "1 : 3.0", "1 : 1.6"], "a": 3}, {"q": "According to Olgyay, which climate has the optimum plan closest to a square (about 1 : 1.1)?", "opts": ["Cool", "Temperate", "Hot-humid", "Hot-arid"], "a": 0}, {"q": "According to Olgyay, which climate allows the most elongated optimum plan (about 1 : 1.7)?", "opts": ["Cool", "Hot-arid", "Hot-humid", "Temperate"], "a": 2}, {"q": "By how much can a correct, well-oriented form reduce energy consumption?", "opts": ["1 % to 3 %", "20 % to 30 %", "60 % to 70 %", "90 % to 100 %"], "a": 1}, {"q": "Which shading type best controls direct radiation on a south façade?", "opts": ["Fixed horizontal elements", "Internal curtains", "Vertical fins only", "Reflective film on the inside of the glass"], "a": 0}, {"q": "What is the recommended approach for north-facing windows?", "opts": ["Make them as large as possible to collect direct gain", "Fit them with fixed horizontal overhangs", "Keep them small and use glazing with a low U-value", "Use only single glazing for daylight"], "a": 2}, {"q": "What is the role of low-emissivity coatings on glass?", "opts": ["They fully replace external shading", "They control the diffuse and long-wave component but do not replace external shading", "They increase direct solar gain in summer", "They are only used for acoustic insulation"], "a": 1}, {"q": "Where horizontal global radiation is high, which surface is the most exposed in summer?", "opts": ["The north wall", "The ground floor slab", "The east wall", "The roof"], "a": 3}, {"q": "What does a light shelf do?", "opts": ["Shades the window and redirects daylight deeper into the room", "Stores heat for the night", "Ventilates the attic", "Collects rainwater from the façade"], "a": 0}, {"q": "Why are internal blinds poor at controlling heat?", "opts": ["They block all daylight", "The solar energy is already inside the glass", "They increase infiltration", "They reflect heat back to the outside completely"], "a": 1}, {"q": "From roughly what dry-bulb temperature should shading be provided?", "opts": ["About 5 °C", "About 12 °C", "About 20 °C", "About 35 °C"], "a": 2}, {"q": "What kind of shading device is recommended for durability?", "opts": ["Complex motorised systems", "Low-tech, low-maintenance devices", "Devices that need daily manual cleaning", "Shading made only of glass"], "a": 1}, {"q": "Which shading elements suit the low, sideways sun on east and west façades?", "opts": ["Deep horizontal overhangs", "Roof skylights", "Clear glass cano he first concert hall designed using a scientific acoustic formula", "It was the first hall built entirely of reinforced concrete", "It was the first hall with electronic amplification", "It was the first vineyard hall"], "a": 0}, {"q": "The Philips Pavilion at Expo 58 in Brussels was designed by Le Corbusier with Iannis Xenakis and distributed electronic music through roughly:", "opts": ["350 loudspeakers", "35 loudspeakers", "12 loudspeakers", "3,500 loudspeakers"], "a": 0}, {"q": "What makes the Berliner Philharmonie (Scharoun, 1963) the model for vineyard halls?", "opts": ["The stage sits at the center and terraced seating blocks surround it, each with its own nearby reflecting walls", "The hall is a narrow, tall rectangle with a flat floor", "The audience sits entirely behind the orchestra", "The ceiling is a single concave dome over the stage"], "a": 0}, {"q": "What acoustic lesson does the Sydney Opera House (1973) teach architects?", "opts": ["Acoustics is cheapest to fix at the sketch stage, since the shells fixed a volume that later needed added reflectors", "Concrete shells always produce ideal reverberation", "Reflectors over a stage are never useful", "Interior volume has no effect on orchestral sound"], "a": 0}, {"q": "The Sala Suggia at Casa da Música, Porto (OMA, 2005) seats 1,238. What is its acoustic form?", "opts": ["A shoebox isolated as a box-within-a-box, with corrugated glass at both ends", "A vineyard with terraced seating around a central stage", "An open-air bowl with no roof", "A dome corrected by beam-steering loudspeakers"], "a": 0}, {"q": "The speed of sound in air at 20 degrees Celsius is about:", "opts": ["343 m/s", "34 m/s", "3,430 m/s", "1,500 m/s"], "a": 0}, {"q": "Sound is a pressure wave in a medium. What follows from that?", "opts": ["There is no sound in a vacuum, and sound travels faster through solids than through air", "Sound travels fastest in a vacuum", "Sound cannot travel through liquids", "Sound travels only through air"], "a": 0}, {"q": "The audible range for young human hearing is approximately:", "opts": ["20 Hz to 20,000 Hz", "2 Hz to 2,000 Hz", "200 Hz to 200,000 Hz", "20 Hz to 2,000 Hz"], "a": 0}, {"q": "Using the relation wavelength = c / f, a 100 Hz tone in air has a wavelength of about:", "opts": ["3.4 m", "0.34 m", "34 m", "343 m"], "a": 0}, {"q": "Frequency, measured in hertz, determines which property of a sound?", "opts": ["Its pitch, with more cycles per second heard as higher", "Its loudness, with more cycles heard as louder", "Its duration", "Its direction of travel"], "a": 0}, {"q": "An increase of 10 dB corresponds to:", "opts": ["Ten times the sound intensity, heard as roughly twice as loud", "Twice the sound intensity, heard as ten times as loud", "Ten times the frequency", "Half the sound intensity"], "a": 0}, {"q": "In the sound pressure level formula Lp = 20 log (p / p0), the reference pressure p0 is:", "opts": ["20 micropascals, the threshold of hearing", "20 pascals", "0 pascals, absolute silence", "1 pascal at 1,000 Hz"], "a": 0}, {"q": "Which set of everyday sound levels is correct?", "opts": ["Whisper 30 dB, conversation 60 dB, busy street 80 dB, hammer 125 dB", "Whisper 60 dB, conversation 80 dB, busy street 100 dB, hammer 125 dB", "Whisper 10 dB, conversation 30 dB, busy street 50 dB, hammer 70 dB", "Whisper 30 dB, conversation 45 dB, busy street 55 dB, hammer 65 dB"], "a": 0}, {"q": "Under EU Directive 2003/10/EC, the lower exposure action value over an 8-hour working day is:", "opts": ["80 dB(A), with an upper action value of 85 and a limit of 87", "85 dB(A), with an upper action value of 87 and a limit of 90", "70 dB(A), with an upper action value of 80 and a limit of 85", "87 dB(A), with no upper value"], "a": 0}, {"q": "Two fans each producing 60 dB at a desk together produce:", "opts": ["63 dB", "120 dB", "66 dB", "60 dB"], "a": 0}, {"q": "A 70 dB source and a 60 dB source in the same room sum to about 70.4 dB. What is the design lesson?", "opts ent, so only facade insulation can control it", "It is below action values, so no control is needed", "It is controlled by national reverberation standards"], "a": 0}, {"q": "Airborne sound insulation is rated by which single-number index, under which standard?", "opts": ["Rw, under EN ISO 717-1", "L'n,w, under EN ISO 717-2", "NRC, under EN ISO 354", "Lden, under Directive 2002/49/EC"], "a": 0}, {"q": "Impact sound is rated by L'n,w under EN ISO 717-2. Its approximate US counterpart is:", "opts": ["IIC", "STC", "NRC", "Rw"], "a": 0}, {"q": "Every material splits incoming sound into three parts. Which statement is correct?", "opts": ["Sound is reflected, absorbed and transmitted, and insulation is not the same thing as absorption", "Sound is only reflected or transmitted, never absorbed", "Absorption and insulation are the same property measured differently", "Porous materials block transmission better than dense ones"], "a": 0}, {"q": "In Doelle's scheme, how many things happen to sound in an enclosed space?", "opts": ["Eight, including incident, reflected, absorbed, diffused, diffracted, transmitted, dissipated and refracted", "Three, reflected, absorbed and transmitted only", "Five, with no diffraction or refraction", "Twelve, including electronic amplification"], "a": 0}, {"q": "Hard surfaces such as stone, ceramic and concrete reflect up to 95% of incident sound. Which surface shape must be avoided over an audience?", "opts": ["Concave, because it focuses the sound", "Convex, because it disperses the sound", "Flat, because it reflects evenly", "Perforated, because it absorbs selected frequencies"], "a": 0}, {"q": "Reverberation occurs when successive reflections arrive too close together to be heard separately. Reverberation time is defined as the time for the sound to fall by:", "opts": ["60 dB", "10 dB", "30 dB", "100 dB"], "a": 0}, {"q": "An echo is heard when the reflection is delayed by at least 0.1 s. How far away must the reflecting surface be?", "opts": ["About 17 m, giving a 34 m round path", "About 34 m, giving a 68 m round path", "About 8.5 m, giving a 17 m round path", "About 100 m, giving a 200 m round path"], "a": 0}, {"q": "Porous materials such as panels, curtains and carpets absorb sound by:", "opts": ["Converting part of each reflection into heat", "Reflecting the sound back toward the source", "Increasing the mass of the partition", "Diffusing the sound evenly through the room"], "a": 0}, {"q": "Using Sabine, T = 0.161 V / A, a 10 x 8 x 3 m classroom of 240 cubic meters needs how much absorption for a 0.6 s reverberation time?", "opts": ["About 64 square meters of absorption, which an absorbent ceiling can supply almost entirely", "About 24 square meters, which curtains alone supply", "About 160 square meters, more than the room's total surface", "About 6 square meters, supplied by furniture"], "a": 0}, {"q": "Refraction describes which behavior of sound?", "opts": ["It changes direction and loses energy when it passes from one medium into another", "It bends around obstacles smaller than its wavelength", "It is converted into heat inside porous materials", "It is scattered evenly by shaped surfaces"], "a": 0}, {"q": "Diffraction explains why acoustic barriers are only partly effective. Why?", "opts": ["Long, low-frequency waves bend around the barrier while short, high-frequency waves are blocked and leave a shadow", "High frequencies bend around the barrier while low frequencies are blocked", "All frequencies pass through the barrier equally", "Barriers only work when they are perforated"], "a": 0}, {"q": "Diffusion is achieved with ribs, steps and coffers in order to:", "opts": ["Scatter reflections so the sound field is even, with no hot or dead spots", "Remove all reflections from the room", "Increase the transmission loss of the wall", "Focus the sound on the rear seats"], "a": 0}, {"q": "The mass law, R is approximately 20 log (m x f) minus 47, means that for a single-leaf wall:", "opts": ["Doubling the mass per square meter adds only about 6 dB, so decoupling beats adding weight", "Doubling the mass per square meter doubles the insulation in decibels", "Mass has no effect at low frequencies", "Doubling the mass adds about 20 dB"], "a": 0}, {"q": "Moving from a single-stud partition to a double-stud partition with the same boards changes the rating from 34 to 39 STC to roughly:", "opts": ["56 to 59 STC, about 20 points gained from the cavity and separated studs", "40 to 44 STC, about 5 points gained", "70 to 80 STC, about 40 points gained", "34 to 39 STC, with no change"], "a": 0}, {"q": "A floating floor reduces impact sound to the dwelling below only if:", "opts": ["The finish does not touch the surrounding walls and the perimeter is isolated", "The screed is bonded directly to the structural slab", "The resilient layer is laid on top of the finish", "The ceiling below is fixed rigidly to the slab"], "a": 0}, {"q": "Why can a small unsealed gap ruin an otherwise good partition?", "opts": ["Sound follows air, so joints, sockets and door thresholds must be sealed", "Gaps increase the mass of the wall unevenly", "Gaps change the material's absorption coefficient", "Gaps only affect impact sound, not airborne sound"], "a": 0}, {"q": "Which zoning rule costs nothing and acts as free insulation?", "opts": ["Placing noisy rooms such as plant rooms, kitchens and elevators far from bedrooms and offices", "Doubling the thickness of every internal partition", "Adding absorbent panels to every ceiling", "Installing laminated glass throughout the building"], "a": 0}, {"q": "In any facade, the acoustic weak point is normally:", "opts": ["The window, so laminated or asymmetric glazing and airtight frames are decisive", "The structural slab edge", "The external render", "The roof parapet"], "a": 0}, {"q": "HVAC noise reaches rooms by two paths. Which measures address them?", "opts": ["Attenuators and lined bends in the ducts, plus anti-vibration mounts and flexible connec ad height and redirect sound away from neighboring desks", "They add mass to the floor slab", "They seal the air paths between workstations", "They focus speech back toward the speaker"], "a": 0}, {"q": "For a reflection to still be useful rather than heard as a separate event, its delay should not exceed about:", "opts": ["30 milliseconds", "300 milliseconds", "3 milliseconds", "1 second"], "a": 0}, {"q": "Walt Disney Concert Hall (Gehry, Los Angeles, 2003) seats 2,265 and needs no orchestra shell because:", "opts": ["Curved Douglas fir walls and ceiling return sound to each seating block in a vineyard layout", "The hall is a narrow shoebox with parallel side walls", "Beam-steering loudspeakers cover each seat", "The stage is enclosed by a glass box"], "a": 0}, {"q": "The Grand Hall of the Elbphilharmonie (Herzog & de Meuron, Hamburg, 2017) seats 2,100 and is lined with:", "opts": ["About 10,000 individually milled gypsum fiber panels, the White Skin", "A single continuous plaster vault", "Perforated steel panels backed by mineral wool", "Movable timber reflectors on tracks"], "a": 0}, {"q": "Harpa in Reykjavik (Henning Larsen with Batteríið, 2011) handles orchestra, opera, amplified music and conferences by:", "opts": ["Combining acoustic panels and curved surfaces that manage reflections, giving variable acoustics", "Fixing a single long reverberation time for every use", "Removing all absorption from the main hall", "Using an open-air enclosure"], "a": 0}, {"q": "Bing Concert Hall at Stanford (Ennead, 2013) seats 842. What tunes the sound?", "opts": ["Suspended reflectors, the clouds, which rise and fall over stage and audience", "Reverberation chambers that open behind the stage", "A retractable roof over the oval drum", "Beam-steering loudspeaker modules"], "a": 0}, {"q": "The Grande salle Pierre Boulez at the Philharmonie de Paris (Jean Nouvel, 2015) seats 2,400. Its acoustic strategy is:", "opts": ["Balconies floating inside an outer acoustic volume, keeping function rnd(n){ // crypto-backed int in [0,n)
  const b = new Uint32Array(1);

  for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; }

}

function drawLogos(){

  const trs = LABTRACK?[LABTRACK]:["architects","engineers"];
  let html="";
  trs.forEach(tr=>{ LAB_GROUPS[tr].forEach(([L,h])=>{
    const v=labValue(tr,L,h), svg=HOUSE_LOGO[houseKey(h)]||"";
    html+=`<div class="hlogo${v===cur?" sel":" grey"}" data-v="${esc(v)}" title="${esc(labName(L,h))}">${svg}<div class="hc">${esc(L)}</div></div>`;
  });});
  HOUSE_EXTRA.forEach(([k,disp])=>{ const svg=HOUSE_LOGO[k]||""; html+=`<div class="hlogo extra grey" title="${esc(disp)}">${svg}<div class="hc">·</div></div>`; });
  box.innerHTML=html;
  box.querySelectorAll(".hlogo:not(.extra)").forEach(d=>d.onclick=()=>{ const s=$("#l-grp"); if(!s) return; s.value=d.dataset.v; s.onchange(); });
}
function renderLab(){
  let grp=""; try{ grp=localStorage.getItem("qml_lab")||""; }catch(e){}
  const fURL=folderURL();
  $("#pg-lab").innerHTML=`<div class="pagehead"><h2>${esc(t("labH"))}</h2><p>${esc(t("labP"))}</p></div>
    ${fURL?`<div class="panel"><div class="panel-body">
      <p class="qtext" style="font-size:14px">📁 ${esc(t("labFolderT"))}</p>
      <p class="hint">${esc(t("labFolderP"))}</p>
      <div class="qnav" style="margin:8px 0 0"><a class="btn solid" href="${esc(fURL)}" target="_blank" rel="noopener" style="font-size:14px;padding:9px 18px">${esc(t("labFolderGo"))} ↗</a></div>
    </div></div>`:""}
    ${UNLOCKED?`<div class="controls">${[1,2,3,4,5].map(k=>`<span class="ctl"><label>${k} · ${esc(LAB_ITEMS[k-1])}</label><input type="text" id="l-furl${k}" style="width:190px" autocomplete="off" spellcheck="false"></span>`).join("")}<button class="btn" id="l-fsave">OK</button></div>`:""}
    <div class="controls">
      <span class="ctl"><label>${esc(t("labProf"))}</label><select id="l-prof"><option value="">—</option><option value="architects"${LABTRACK==="architects"?" selected":""}>${esc(LAB_PROF.architects)}</option><option value="engineers"${LABTRACK==="engineers"?" selected":""}>${esc(LAB_PROF.engineers)}</option></select></span>
      <span class="ctl"><label>${esc(t("labGroup"))}</label>${labGroupSelect("l-grp", grp, LABTRACK||undefined)}</span>
      <span class="hint" id="l-msg"></span>
    </div>
    <div class="hlogos" id="l-logos"></div>
    <p class="labmem" id="l-members" hidden></p>
    <div id="l-slots"></div>`;
  $("#l-prof").onchange=()=>{
    LABTRACK=$("#l-prof").value;
    try{ localStorage.setItem("qml_labtrack",LABTRACK); }catch(e){}
    try{ // drop the group if it belongs to the other professor's track
      const g=localStorage.getItem("qml_lab");
      if(g){ const pp=labParse(g); if(pp && LABTRACK && pp.track!==LABTRACK) localStorage.removeItem("qml_lab"); }
    }catch(e){}
    LABST=null; renderLab();
  };
  $("#l-grp").onchange=()=>{
    try{ localStorage.setItem("qml_lab",$("#l-grp").value); }catch(e){}
    const p=labParse($("#l-grp").value);
    if(p && p.track!==LABTRACK){ // group implies its professor: follow it
      LABTRACK=p.track;
      try{ localStorage.setItem("qml_labtrack",LABTRACK); }catch(e){}
      LABST=null; renderLab(); return;
    }
    LABST=null; drawMembers(); loadLabStatus();
  };
  for(let k=1;k<=LAB_N;k++){ const fi=$("#l-furl"+k); if(fi) fi.value=slotFolderStored(k)||LAB_FOLDERS[k]||""; }
  const fsv=$("#l-fsave");
  if(fsv){ fsv.onclick=()=>{ for(let k=1;k<=LAB_N;k++){ const fi=$("#l-furl"+k); if(!fi) continue; const v=fi.value.trim(); try{ if(v) localStorage.setItem("qal_folder_"+k,v); else localStorage.removeItem("qal_folder_"+k); }catch(e){} } renderLab(); }; }
  drawMembers();
  if(LABST && LABST.grp===grp) drawLabSlots(); // last known state at once, then a fresh one (the teacher may have opened one)
  loadLabStatus();
}
function drawMembers(){ // the chosen group's students, straight from LAB_GROUPS (professor shown by the selector)
  const el=$("#l-members"), p=labParse($("#l-grp").value); if(!el) return;
  const g=p && (LAB_GROUPS[p.track]||[]).find(x=>x[0]===p.g), names=(g && g[2]) || [];
  el.hidden=!names.length;
  el.innerHTML=names.length ? `<span class="k">${esc(t("labMembers"))}</span>${names.map(esc).join(" · ")}` : "";
  drawLogos();
}
async function loadLabStatus(){ // "open the group": its 5 submissions, open/closed and what was handed in
  const out=$("#l-slots"), msg=$("#l-msg"), grp=$("#l-grp").value, p=labParse(grp);
  if(!p){ out.innerHTML=`<p class="hint">${esc(t("labPick"))}</p>`; return; }
  const url=submitURL(); if(!url){ msg.textContent=t("trNeedURL"); return; }
  msg.textContent=t("clsBusy");
  try{
    const r=await toWorker(url,{action:"labstatus", track:p.track, g:p.g});
    const j=await r.json().catch(()=>({}));
    if($("#l-grp").value!==grp) return; // another group was chosen meanwhile
    if(!r.ok || !j.ok){ out.innerHTML=""; msg.textContent = r.status===403 ? t("labOld") : `${t("clsFail")} (${r.status}${j.error?" "+j.error:""})`; return; }
    msg.textContent=""; LABST={grp, open:j.open||[], subs:j.subs||{}}; drawLabSlots();
  }catch(e){ msg.textContent=await workerDiag(url); }
}
function slotFolderStored(k){
  try{ return localStorage.getItem("qal_folder_"+k) || ""; }catch(e){ return ""; }
}
function slotFolder(k){
  return slotFolderStored(k) || LAB_FOLDERS[k] || folderURL() || "";
}
function drawLabSlots(){
  const out=$("#l-slots"); if(!out || !LABST) return;
  out.innerHTML=[...Array(LAB_N).keys()].map(i=>{
    const k=i+1, open=LABST.open.includes(k), x=LABST.subs[k];
    const last = !x ? "" : `${esc(t("labLast"))} ${esc(fmtLocal(x.date))} · ${x.kind==="pdf" ? `${esc(x.file||"PDF")} (${fmtMB(x.size)})`
      : safeLink(x.link) ? `<a href="${esc(x.link)}" target="_blank" rel="noopener">${esc(t("labLinkW"))}</a>` : esc(t("labLinkW"))}`;
    const pill = x ? `<span class="pill ok">${esc(t("labDone"))}</span>` : `<span class="pill ${open?"idle":"bad"}">${esc(t(open?"labOpen":"labClosed"))}</span>`;
    return `<div class="panel labslot"><div class="panel-head"><div class="panel-title"><h3>${esc(labSubName(k))}</h3>${last?`<p>${last}</p>`:""}</div>${pill}</div>
      <div class="panel-body">${open ? `<div class="controls" style="margin:0">
        <span class="ctl"><label>PDF ≤ 10 MB</label><input type="file" id="l-f${k}" accept="application/pdf,.pdf"></span>
        <span class="ctl"><label>${esc(t("labOr"))}</label><input type="url" id="l-l${k}" placeholder="${esc(t("labLinkPh"))}" style="width:230px"></span>
        <button class="btn solid" id="l-s${k}">${esc(t(x?"labResend":"labSend"))}</button>
        <span class="hint" id="l-m${k}">${x?esc(t("labReplace")):""}</span></div>`
      : `<p class="hint" style="margin:0">${esc(t("labClosedMsg"))}</p>`}
      ${(()=>{const fU=slotFolder(k); return fU?`<div class="qnav" style="margin:10px 0 0"><a class="btn" href="${esc(fU)}" target="_blank" rel="noopener">${esc(t("labFolderGo"))} ↗</a><span class="hint">PDF ≤ 10 MB</span></div>`:"";})()}</div></div>`;
  }).join("");
  for(let k=1;k<=LAB_N;k++){ const b=$("#l-s"+k); if(b) b.onclick=()=>labSend(k); }
}
const fileB64 = f => new Promise((ok,no)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(",")[1]||""); r.onerror=()=>no(r.error); r.readAsDataURL(f); });
async function labSend(k){
  const msg=$("#l-m"+k), btn=$("#l-s"+k), p=labParse($("#l-grp").value);
  const f=$("#l-f"+k).files[0], link=$("#l-l"+k).value.trim();
  if(!p){ msg.textContent=t("labPick"); return; }
  if(!f && !link){ msg.textContent=t("labNeedFile"); return; }
  if(f && !(f.type==="application/pdf" || /\.pdf$/i.test(f.name))){ msg.textContent=t("labNotPdf"); return; }
  if(f && f.size>LAB_MAX){ msg.textContent=t("labTooBig"); return; }
  if(!f && !safeLink(link)){ msg.textContent=t("labBadLink"); return; }
  const url=submitURL(); if(!url){ msg.textContent=t("trNeedURL"); return; }
  btn.disabled=true; msg.textContent=t("labSending");
  try{
    const q=new URLSearchParams({action:"labsubmit", track:p.track, g:p.g, k:String(k)}); // a group submission, no submitter name
    let body="";
    if(f){ q.set("file", f.name); body=await fileB64(f); } else { q.set("kind","link"); q.set("link",link); }
    const r=await fetch(url+(url.includes("?")?"&":"?")+q, {method:"POST", headers:{"Content-Type":"text/plain;charset=UTF-8"}, body});
    const j=await r.json().catch(()=>({}));
    if(r.ok && j.ok){
      await loadLabStatus(); const m=$("#l-m"+k); if(m) m.textContent=t("labSent"); return;
    }
    if(j.error==="closed"){ await loadLabStatus(); ($("#l-m"+k)||$("#l-msg")).textContent=t("labIsClosed"); return; } // closed meanwhile: show the fresh state
    msg.textContent = (r.status===413 || j.error==="too large") ? t("labTooBig")
      : j.error==="not pdf" ? t("labNotPdf") : j.error==="link" ? t("labBadLink") : (r.status===403 || j.error==="bad json") ? t("labOld")
      : `${t("clsFail")} (${r.status}${j.error?" "+j.error:""}${j.detail?": "+j.detail:""})`;
  }catch(e){ msg.textContent=await workerDiag(url); }
  btn.disabled=false;
}

}
function whoBind(gate){
  const nmI=$("#c-name"), nuI=$("#c-num"), ul=$("#c-sug"); let timer=0, seq=0, items=[], cur=-1;
  const close=()=>{ ul.hidden=true; ul.innerHTML=""; items=[]; cur=-1; nmI.setAttribute("aria-expanded","false"); };
  const mark=()=>{ nmI.classList.toggle("ok",!!PICK); nuI.classList.toggle("ok",!!PICK); };
  const choose=x=>{ PICK={num:x.num,name:x.name}; nmI.value=x.name; nuI.value=x.num; close(); mark(); gate(); };
  const show=list=>{
    items=list; cur=-1;
    if(!list.length){ close(); return; }
    ul.innerHTML=list.map((x,i)=>`<li role="option" id="c-sug-${i}" data-i="${i}">${esc(x.name)}<span>${esc(x.num)}</span></li>`).join("");
    ul.hidden=false; nmI.setAttribute("aria-expanded","true");
    ul.querySelectorAll("li").forEach(li=>li.onmousedown=e=>{ e.preventDefault(); choose(items[+li.dataset.i]); });
  };
  const ask=(q,fromNum)=>{
    clearTimeout(timer); const my=++seq;
    timer=setTimeout(async()=>{
      try{
        const list=await whoAsk(q); if(my!==seq) return;
        // a full student number with a single match fills the name straight away
        if(fromNum && list.length===1 && list[0].num===q.replace(/\D/g,"")){ choose(list[0]); return; }
        show(list);
      }catch(e){ if(my===seq){ close(); $("#c-warn").textContent=t("rosterDown"); } }
    },220);
  };
  const edited=()=>{ if(PICK && (nmI.value.trim()!==PICK.name || nuI.value.trim()!==PICK.num)){ PICK=null; mark(); } };
  nmI.oninput=()=>{ edited(); gate(); ask(nmI.value,false); };
  nuI.oninput=()=>{ nuI.value=nuI.value.replace(/\D/g,"").slice(0,12); edited(); gate(); ask(nuI.value,true); };
  const keys=e=>{
    if(ul.hidden||!items.length) return;
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); cur=(cur+(e.key==="ArrowDown"?1:-1)+items.length)%items.length;
      ul.querySelectorAll("li").forEach((li,i)=>li.setAttribute("aria-selected",String(i===cur))); nmI.setAttribute("aria-activedescendant","c-sug-"+cur); }
    else if(e.key==="Enter"&&cur>=0){ e.preventDefault(); choose(items[cur]); }
    else if(e.key==="Escape") close();
  };
  nmI.onkeydown=keys; nuI.onkeydown=keys;
  nmI.addEventListener("blur",()=>setTimeout(close,150)); nuI.addEventListener("blur",()=>setTimeout(close,150));
  mark();
}
function startQuiz(){
  const nm=$("#c-name").value.trim(), kg=$("#c-klass").value;
  if(/^(https?:\/\/|www\.)/i.test(nm)){
    $("#c-warn").textContent=t("badName");
    $("#c-name").focus();
    return;
  }
  if(!nm || !kg){
    $("#c-warn").textContent=t("needId");
    (!nm?$("#c-name"):$("#c-klass")).focus();
    return;
  }
  const lesson = LESSON_SEL;
  if(lessonBlocked(lesson)){ $("#c-warn").textContent=t("lessonClosed"); return; }
  const bank = currentBank(lesson);
  let n = Math.max(1, Math.min(bank.length, parseInt($("#c-n").value||"10",10)));
  const shQ = $("#c-sq").checked, shO = $("#c-so").checked;
  const idx = isExam(lesson) ? examIdx(bank) : shQ ? sampleIdx(bank.length, n) : [...Array(bank.length).keys()].slice(0,n);
  if(isExam(lesson)) n = idx.length;
  const items = idx.map(bi => {
    const s = bank[bi];
    const order = shO ? shuffle([0,1,2,3]) : [0,1,2,3];
    return { q:s.q, opts:order.map(o=>s.opts[o]), correct:order.indexOf(s.a), src:bi };
  });
  const mins = parseInt($("#c-min").value||"0",10);
  Q = { lesson, n, items, ans:{}, i:0, done:false,
        oneBy:$("#c-ob").checked, name:$("#c-name").value.trim(), num:PICK?PICK.num:"",
        klass:$("#c-klass").value.trim(), id:newAttemptId(), mins,
        startT:Date.now(), left:mins>0?mins*60:null, timerId:null, bankSize:bank.length };
  if(Q.left!==null){
    Q.timerId = setInterval(()=>{
      Q.left--;
      qTick();
      if(Q.left<=0){ clearInterval(Q.timerId); finishQuiz(true); }
    },1000);
  }
  renderQuiz();
}

function resultPayload(code,A){ // A: attempt (quiz Q or projector S)

/* ---------- sending results: automatic, no code to type ---------- */
// Class code sent with a result: a ?code= link wins, otherwise the lecture itself (aula2 -> "Lecture02"),
// which is what the Worker's CLASS_CODE lists.
function classCode(lesson){ return DEF.code || "Lecture"+String(lesson).replace(/\D/g,"").padStart(2,"0"); }
async function postAttempt(A){ // "" when stored, otherwise the reason to show
  const url=submitURL();
  try{
    const r=await toWorker(url, resultPayload(classCode(A.lesson), A));
    if(r.ok){ try{localStorage.setItem("qal_sent_"+A.id,"1");}catch(e){} return ""; }
    const j=await r.json().catch(()=>({}));
    if(r.status===403 && j.error==="enrolled") return t("notEnrolled");
    if(r.status===403) return `${t("codeRejected")} ${classCode(A.lesson)}`;
    return `${t("srvFail")} (${r.status}${j.error?" "+j.error:""}${j.detail?": "+j.detail:""})`;
  }catch(e){ return await workerDiag(url); }
}
function autoSend(A, redraw){ // A.send: "sending" | "fail" (A.sendMsg = reason); A.sent once stored
  if(!submitURL() || A.sent || A.send==="sending") return;
  A.send="sending"; A.sendMsg=""; redraw();
  postAttempt(A).then(m=>{ A.send=m?"fail":"done"; A.sendMsg=m; if(!m) A.sent=true; redraw(); });
}
function sendStatusHTML(A, retryId){
  return A.sent ? `<span class="pill ok">${esc(t("sent"))}</span><span class="meta">${esc(A.id)}</span>`
    : A.send==="fail" ? `<button class="btn solid" id="${retryId}">${esc(t("sendAgain"))}</button><span class="hint">${esc(A.sendMsg)}</span>`
    : `<span class="hint">${esc(t("sending"))}</span>`;
}
// The POST got no readable answer: ask the Worker with a plain GET to tell "offline / wrong code deployed"
// from "quiz Worker deployed but it crashed" (our worker.js answers GET with {"error":"POST only"} + CORS).
async function workerDiag(url){
  try{
    const r=await fetch(url); const j=await r.json();
    if(j && j.error==="POST only") return t("wkCrash");
  }catch(e){}
  return `${t("wkDown")} ${url}`;
}

/* ---------- Portuguese translation with Gemma (teacher, through the Worker) ---------- */
// The Worker (worker.js, action "translate") holds the model; the page never sees a key.
// Output: bank-pt.json in the repo root, loaded at start-up as the PT bank (answer key from EN).
// Worker teacher code: remembered on this device once it has worked (the teacher's own computer), until Forget.
function tcodeLoad(){ try{ return localStorage.getItem("qml_tcode")||""; }catch(e){ return ""; } }
function tcodeKeep(ok){ try{ if(ok) localStorage.setItem("qml_tcode",TRCODE); else localStorage.removeItem("qml_tcode"); }catch(e){} }
let TRS = {}, TRCODE = tcodeLoad(), PTX = {}, TRMODEL = "";
function ptItemOK(it,src){ return it && typeof it.q==="string" && it.q.trim() && Array.isArray(it.opts) && it.opts.length===4 &&
  it.opts.every(o=>typeof o==="string" && o.trim()) && it.a===src.a; }
function trSay(s){ const m=$("#b-trmsg"); if(m) m.textContent=s; }
function trCell(s,i,ed){
  const at=f=>ed?` contenteditable="true" spellcheck="true" data-i="${i}" data-f="${f}"`:"";
  return `<div class="trq"${at("q")}>${esc(s.q)}</div>`+s.opts.map((o,k)=>
    `<div class="tro${k===s.a?" ok":""}"><span class="L">${LETTERS[k]}</span><span${at(k)}>${esc(o)}</span></div>`).join("");
}
function drawTR(bk){
  const out=$("#b-trout"); if(!out) return;
  if(!TRS[bk] && PTX[bk]) TRS[bk]={lesson:bk, items:PTX[bk].map(it=>({q:it.q,opts:it.opts.slice(),a:it.a})), n:PTX[bk].length, done:true, loaded:true};
  const job=TRS[bk], src=BANKS.en[bk];
  $("#b-trdl").disabled=!Object.values(TRS).some(j=>j.done) && !Object.keys(PTX).length;
  $("#b-tr").disabled=!!(job&&job.busy);
  if(!job){ out.innerHTML=""; trSay(""); return; }
  trSay(job.busy?`${t("trBusy")} ${job.items.length}/${job.n}`:job.err?job.err:job.loaded?t("trLoaded"):job.done?t("trDone"):"");
  out.innerHTML=!job.items.length?"":`<div class="tbl-scroll" style="margin-top:12px"><table class="data trtab">
    <thead><tr><th class="num">${esc(t("thN"))}</th><th>English</th><th>Português</th></tr></thead>
    <tbody>${job.items.map((it,i)=>`<tr><td class="num">${i+1}</td><td>${trCell(src[i],i,false)}</td><td>${trCell(it,i,job.done)}</td></tr>`).join("")}</tbody>
  </table></div>`;
}
async function runTranslate(bk){
  const url=submitURL();
  if(!url){ trSay(t("trNeedURL")); return; }
  if(!TRCODE){ trSay(t("trNeedCode")); $("#b-tcode").focus(); return; }
  const src=BANKS.en[bk];
  let job=TRS[bk];
  if(job && job.done && !confirm(t("trRedo"))) return;
  if(!job || job.done) job=TRS[bk]={lesson:bk, items:[], n:src.length, done:false}; // otherwise resume where it stopped
  job.busy=true; job.err="";
  const redraw=()=>{ if(TAB==="bank" && $("#b-lesson") && $("#b-lesson").value===bk) drawTR(bk); };
  redraw();
  while(job.items.length<src.length){
    const from=job.items.length, batch=src.slice(from, from+10);
    let res=null, err=t("trFail");
    for(let tries=0; tries<2 && !res; tries++){
      try{
        const r=await toWorker(url,{action:"translate", code:TRCODE, items:batch.map(s=>({q:s.q,opts:s.opts}))});
        const j=await r.json().catch(()=>({}));
        if(r.status===403){ err=t("trBadCode"); tcodeKeep(false); break; }
        if(r.ok && j.ok && Array.isArray(j.items) && j.items.length===batch.length){ res=j.items; TRMODEL=j.model||TRMODEL; tcodeKeep(true); }
        else if(j.error) err=`${t("trFail")} (${j.error})`;
      }catch(e){ err=t("netFail"); }
    }
    if(!res){ job.busy=false; job.err=err; redraw(); return; }
    res.forEach((it,k)=>job.items.push({q:it.q, opts:it.opts.slice(0,4), a:batch[k].a}));
    redraw();
  }
  job.busy=false; job.done=true; redraw();
}
function trDownload(){
  const banks={};
  Object.keys(BANKS.en).forEach(k=>{
    const job=TRS[k];
    if(job && job.done) banks[k]=job.items.map(it=>({q:it.q, opts:it.opts.slice(), a:it.a}));
    else if(PTX[k]) banks[k]=PTX[k];
  });
  if(Object.entries(banks).some(([k,L])=>!L.every((it,i)=>ptItemOK(it,BANKS.en[k][i])))){ trSay(t("trEmpty")); return; }
  const body=JSON.stringify({format:"ec-ee-machine-bank-pt", version:1, model:TRMODEL||"@cf/google/gemma-4-26b-a4b-it",
    updated:new Date().toISOString(), banks}, null, 1);
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([body],{type:"application/json"})); a.download="bank-pt.json";
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
  trSay(t("trSaved"));
}
function loadPT(){ // bank-pt.json next to index.html (GitHub Pages); silently absent offline or before first upload
  fetch("bank-pt.json",{cache:"no-cache"}).then(r=>r.ok?r.json():null).then(j=>{
    if(!j || !j.banks) return;
    Object.keys(BANKS.en).forEach(k=>{
      const L=j.banks[k], src=BANKS.en[k];
      if(Array.isArray(L) && L.length===src.length && L.every((it,i)=>ptItemOK(it,src[i]))){ BANKS.pt[k]=L; PTX[k]=L; }
    });
    if(TAB==="bank") renderPage();
  }).catch(()=>{});
}

function csvEsc(v){
  v=v==null?"":String(v);
  if(/^[=+\-@\t\r]/.test(v)) v="'"+v; // student-typed names must not run as spreadsheet formulas
  return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
}
function fmtLocal(s){ // stored dates are UTC ("…T15:54:02.744Z" or local rows "2026-10-09 15:54") → local "YYYY-MM-DD HH:MM"
  s=String(s||"");
  const d=new Date(/(Z|[+-]\d\d:?\d\d)$/.test(s) ? s : s.replace(" ","T")+(s.length<=16?":00Z":"Z"));
  if(isNaN(d)) return s;
  const p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function downloadCSV(rows, fname, withClass){
  const head=["date","name","group",...(withClass?["class","university"]:[]),"bank","attempt","n","score","pct","points","secs","detail"];
  const lines=[head.join(";")].concat(rows.map(r=>[fmtLocal(r.date),r.name,r.klass,...(withClass?[r.cls,r.uni&&UNIS[r.uni]?UNIS[r.uni].name:""]:[]),r.lesson,r.id,r.n,r.score,r.pct,fmtPts(pts(r.score,r.n)).replace(".",","),r.secs,r.detail].map(csvEsc).join(";")));
  const blob=new Blob(["\ufeff"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fname;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
}

function codeCheck(val){ // teacher code with the shared escalating lockout; "" = unlocked, otherwise the message to show
  const now=Date.now(), info=lockInfo();
  const wait=r=>`${t("lockedMsg")} ${Math.floor(r/60000)}:${String(Math.floor(r%60000/1000)).padStart(2,"0")} ${t("minShort")}`;
  if(now<info.u) return wait(info.u-now);
  if(val===SETTINGS_CODE){ lockSave({f:0,u:0}); UNLOCKED=true; return ""; }
  info.f=(info.f||0)+1;
  if(info.f===3) info.u=now+5*60*1000;
  else if(info.f===4) info.u=now+10*60*1000;
  else if(info.f>=5) info.u=now+60*60*1000;
  lockSave(info);
  const ru=info.u-Date.now();
  return ru>0 ? wait(ru) : `${t("wrongCode")} (${Math.max(0,3-info.f)} ${t("triesLeft")})`;
}
